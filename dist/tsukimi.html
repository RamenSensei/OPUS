<style>
/* ==========================================================================
   film.css — the theatre, the calligraphy layer and the controls.
   Single, deliberate look: a darkened room (墨) around a lit woodblock print.
   ========================================================================== */
:root {
  color-scheme: dark;
  --room: #0d0c0b;
  --room-2: #16130f;
  --paper: #ede3cc;
  --gofun: #f3ede0;
  --sumi: #1c1a18;
  --shu: #d9512c;
  --kin: #c9a45c;
  --kon: #1f2f57;
  --muted: #a39a88;
  --line: rgba(201, 164, 92, 0.35);
  --f-brush: 'Yuji Syuku', 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'Noto Serif CJK JP', serif;
  --f-mincho: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'Noto Serif CJK JP', serif;
  --f-zh: 'Noto Serif SC', 'Songti SC', 'STSong', 'Source Han Serif SC', 'Noto Serif CJK SC', serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 40%, var(--room-2), var(--room) 70%);
  background-color: var(--room);
  color: var(--gofun);
  font-family: var(--f-mincho);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#theatre {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#theatre:fullscreen { background: #000; }

#stage {
  position: relative;
  overflow: hidden;
  background: var(--paper);
  box-shadow: 0 0 0 1px rgba(201, 164, 92, 0.12), 0 30px 80px rgba(0, 0, 0, 0.65);
  cursor: pointer;
}
#film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* logical 1920×1080 layer, scaled by the engine */
#overlay {
  position: absolute;
  left: 0; top: 0;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
  pointer-events: none;
}

/* ---------------------------------------------------------------- poems */
.poem, .title-card, .cartouche, .caption { position: absolute; }
.poem .cols { display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 0.5em; }
.poem .col {
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-family: var(--f-brush);
  font-size: var(--fs, 60px);
  line-height: 1;
  letter-spacing: 0.14em;
  white-space: nowrap;
}
.poem.waka .col { font-size: var(--fs, 50px); letter-spacing: 0.1em; }
.poem.narration .col { font-family: var(--f-mincho); font-weight: 600; font-size: var(--fs, 40px); letter-spacing: 0.18em; }
.poem .ch { display: inline-block; opacity: 0; will-change: opacity, filter; }
.poem .ch.sp { width: 0.5em; }

.ink-light { color: var(--gofun); text-shadow: 0 0 18px rgba(10, 16, 36, 0.55), 0 0 3px rgba(10, 16, 36, 0.5); }
.ink-dark  { color: var(--sumi);  text-shadow: 0 0 14px rgba(243, 237, 224, 0.6); }
.ink-gold  { color: #e8cf94; text-shadow: 0 0 18px rgba(10, 16, 36, 0.6), 0 0 3px rgba(10, 16, 36, 0.5); }

.poem .sig { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: auto; align-self: flex-end; padding-bottom: 4px; }
.poem .author {
  writing-mode: vertical-rl;
  font-family: var(--f-mincho);
  font-size: 26px;
  letter-spacing: 0.3em;
  opacity: 0.85;
}
.seal {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  background: var(--shu);
  color: var(--gofun);
  font-family: var(--f-mincho);
  font-weight: 800;
  font-size: 26px;
  line-height: 1;
  border-radius: 3px;
  text-shadow: none;
  box-shadow: inset 0 0 0 2px rgba(243, 237, 224, 0.28);
}

.pos-right       { right: 150px; top: 120px; }
.pos-upper-right { right: 110px; top: 70px; }
.pos-left        { left: 150px;  top: 120px; }
.pos-upper-left  { left: 110px;  top: 70px; }
.pos-center      { left: 50%; top: 140px; transform: translateX(-50%); }
.pos-lower-right { right: 150px; bottom: 150px; }
.pos-lower-left  { left: 150px; bottom: 150px; }

/* ---------------------------------------------------------- title card */
.title-card { display: flex; flex-direction: column; align-items: center; gap: 36px; }
.title-card .cols { display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 28px; }
.title-card .col {
  writing-mode: vertical-rl;
  font-family: var(--f-brush);
  font-size: var(--fs, 132px);
  letter-spacing: 0.08em;
  line-height: 1;
}
.title-card .ch { display: inline-block; opacity: 0; }
.title-card .sig { display: flex; flex-direction: column; align-items: center; gap: 14px; align-self: flex-end; }
.title-card .author { writing-mode: vertical-rl; font-size: 28px; letter-spacing: 0.3em; }
.title-card .seal { width: 54px; height: 54px; font-size: 36px; }
.title-sub { text-align: center; display: grid; gap: 10px; }
.title-zh { font-family: var(--f-zh); font-size: 34px; letter-spacing: 0.5em; padding-left: 0.5em; }
.title-en { font-family: var(--f-mincho); font-size: 20px; letter-spacing: 0.42em; text-transform: uppercase; opacity: 0.75; padding-left: 0.42em; }

/* ------------------------------------------------------------ cartouche */
.cartouche {
  padding: 22px 16px;
  background: linear-gradient(180deg, #f1e6c9, #e6d6ae);
  color: var(--sumi);
  border: 2px solid var(--sumi);
  box-shadow: inset 0 0 0 5px #f1e6c9, inset 0 0 0 6.5px rgba(28, 26, 24, 0.75), 0 2px 0 rgba(0, 0, 0, 0.15);
  text-shadow: none;
}
.cartouche .cols { display: flex; flex-direction: row-reverse; gap: 10px; align-items: flex-start; }
.cartouche .col {
  writing-mode: vertical-rl;
  font-family: var(--f-mincho);
  font-weight: 800;
  font-size: var(--fs, 38px);
  letter-spacing: 0.22em;
  line-height: 1;
}
.cartouche .col + .col { font-weight: 600; font-size: calc(var(--fs, 38px) * 0.62); opacity: 0.85; }
.cartouche .ch { display: inline-block; opacity: 0; }
.cartouche .sig { align-self: flex-end; }
.cartouche .seal { width: 26px; height: 26px; font-size: 17px; }
.cartouche .author { display: none; }

/* -------------------------------------------------------------- caption */
.caption { font-family: var(--f-mincho); font-size: var(--fs, 30px); letter-spacing: 0.3em; }
.caption .ch { display: inline-block; opacity: 0; }

/* ------------------------------------------------------------ subtitles */
#subs {
  position: absolute;
  left: 50%;
  bottom: 54px;
  transform: translateX(-50%);
  width: 1500px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
}
#subs.off { visibility: hidden; }
.sub-zh {
  font-family: var(--f-zh);
  font-size: 34px;
  line-height: 1.5;
  letter-spacing: 0.12em;
  color: var(--gofun);
  text-shadow: 0 0 10px rgba(8, 10, 20, 0.85), 0 0 2px rgba(8, 10, 20, 0.9), 0 2px 18px rgba(8, 10, 20, 0.6);
  text-wrap: balance;
}
.sub-en { font-size: 20px; letter-spacing: 0.1em; opacity: 0.7; margin-top: 4px; }
.sub-en:empty { display: none; }

/* -------------------------------------------------------------- curtain */
#curtain {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(13, 12, 11, 0.25), rgba(13, 12, 11, 0.82) 72%),
    linear-gradient(180deg, rgba(13, 12, 11, 0.2), rgba(13, 12, 11, 0.6));
  transition: opacity 1.6s ease, visibility 1.6s;
  cursor: default;
}
body.started #curtain { opacity: 0; visibility: hidden; }
.curtain-inner { display: grid; justify-items: center; gap: clamp(10px, 2.2vmin, 26px); text-align: center; padding: 16px; }
.curtain-title { display: flex; flex-direction: row-reverse; gap: clamp(8px, 1.4vmin, 18px); align-items: flex-start; }
.curtain-title .v { writing-mode: vertical-rl; font-family: var(--f-brush); font-size: clamp(34px, 9vmin, 104px); line-height: 1; letter-spacing: 0.06em; color: var(--gofun); text-shadow: 0 0 30px rgba(0, 0, 0, 0.6); }
.curtain-title .v.small { font-family: var(--f-mincho); font-size: clamp(14px, 2.4vmin, 26px); letter-spacing: 0.4em; opacity: 0.8; margin-top: 1.2em; }
.curtain-zh { font-family: var(--f-zh); font-size: clamp(14px, 2.4vmin, 24px); letter-spacing: 0.5em; padding-left: 0.5em; color: var(--gofun); opacity: 0.9; }
#btn-start {
  appearance: none;
  border: 1px solid var(--kin);
  background: rgba(13, 12, 11, 0.55);
  color: var(--gofun);
  font-family: var(--f-mincho);
  font-size: clamp(14px, 2.2vmin, 22px);
  letter-spacing: 0.4em;
  padding: 0.75em 1.4em 0.75em 1.8em;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.8em;
  transition: background 0.3s, border-color 0.3s;
}
#btn-start:hover, #btn-start:focus-visible { background: rgba(201, 164, 92, 0.18); border-color: #e8cf94; outline: none; }
#btn-start .seal { width: 1.6em; height: 1.6em; font-size: 1em; letter-spacing: 0; }
.curtain-hint { font-family: var(--f-zh); font-size: clamp(11px, 1.5vmin, 14px); letter-spacing: 0.2em; color: var(--muted); }

/* -------------------------------------------------------------- the end */
#end {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: end center;
  padding-bottom: 7%;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1.4s ease 0.4s;
}
body.ended #end { opacity: 1; visibility: visible; }
#btn-again {
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(13, 12, 11, 0.5);
  color: var(--gofun);
  font-family: var(--f-mincho);
  font-size: clamp(12px, 1.8vmin, 18px);
  letter-spacing: 0.35em;
  padding: 0.6em 1.2em 0.6em 1.55em;
  cursor: pointer;
}
#btn-again:hover, #btn-again:focus-visible { border-color: var(--kin); outline: none; }

/* ------------------------------------------------------------- controls */
#bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 26px 18px 12px;
  background: linear-gradient(180deg, rgba(13, 12, 11, 0), rgba(13, 12, 11, 0.78));
  display: grid;
  gap: 8px;
  opacity: 0;
  transition: opacity 0.5s ease;
  cursor: default;
}
body.started.ui #bar, body.started.paused #bar { opacity: 1; }
body.still #bar, body.still #curtain, body.still #end { display: none !important; }
.track { position: relative; height: 18px; }
#ticks { position: absolute; inset: 7px 0; display: flex; }
.tick {
  position: absolute; top: 0; bottom: 0;
  appearance: none; border: 0; padding: 0; margin: 0;
  background: rgba(243, 237, 224, 0.16);
  border-left: 2px solid rgba(13, 12, 11, 0.9);
  cursor: pointer;
}

<script>
/* ==========================================================================
   util.js — deterministic math toolkit shared by every scene.
   Everything here is pure: same input, same output. Scenes must never use
   Math.random() for anything that is drawn; use U.rng(seed) or U.hash().
   ========================================================================== */
(function (TSUKI) {
  'use strict';

  const U = (TSUKI.U = {});
  U.TAU = Math.PI * 2;

  /* ---------- scalar helpers ---------- */
  U.clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.invLerp = (a, b, x) => (b === a ? 0 : (x - a) / (b - a));
  U.remap = (x, a, b, c, d) => U.lerp(c, d, U.invLerp(a, b, x));
  U.smoothstep = (a, b, x) => {
    const t = U.clamp(U.invLerp(a, b, x));
    return t * t * (3 - 2 * t);
  };

  U.deg = (d) => (d * Math.PI) / 180;

  /** Progress of t through [a,b], clamped to 0..1, optionally eased. */
  U.seg = (t, a, b, ease) => {
    const p = U.clamp(U.invLerp(a, b, t));
    return ease ? ease(p) : p;
  };

  /** Envelope: 0 before a, rises to 1 at b, holds, falls to 0 from c to d. */
  U.env = (t, a, b, c, d, ease = U.ease.inOutSine) => {
    if (t <= a || t >= d) return 0;
    if (t < b) return ease(U.invLerp(a, b, t));
    if (t <= c) return 1;
    return ease(1 - U.invLerp(c, d, t));
  };

    linear: (t) => t,
    inSine: (t) => 1 - Math.cos((t * Math.PI) / 2),
    outSine: (t) => Math.sin((t * Math.PI) / 2),
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    inQuad: (t) => t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    inOutQuad: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    inCubic: (t) => t * t * t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    inExpo: (t) => (t === 0 ? 0 : Math.pow(2, 10 * t - 10)),
    outBack: (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },

  /* ---------- hashing & seeded randomness ---------- */
  /** Integer hash → [0,1). Works for any finite number (floored). */
  U.hash = (n) => {
    let x = Math.floor(n) | 0;
    x = Math.imul(x ^ (x >>> 16), 0x7feb352d);
    x = Math.imul(x ^ (x >>> 15), 0x846ca68b);
    x ^= x >>> 16;
    return (x >>> 0) / 4294967296;
  };
  U.hash2 = (x, y) => U.hash(Math.floor(x) * 374761393 + Math.floor(y) * 668265263);
  U.hash3 = (x, y, z) => U.hash(Math.floor(x) * 374761393 + Math.floor(y) * 668265263 + Math.floor(z) * 2147483647);

  /** mulberry32 seeded PRNG. const r = U.rng(42); r() → [0,1) */
  U.rng = (seed) => {
    let a = (seed * 2654435761) >>> 0;
    const next = () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

    next.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * next());
    next.pick = (arr) => arr[Math.floor(next() * arr.length)];

  const sm = (t) => t * t * (3 - 2 * t);
  U.noise1 = (x, seed = 0) => {
    const i = Math.floor(x), f = x - i;
    return U.lerp(U.hash(i + seed * 7919), U.hash(i + 1 + seed * 7919), sm(f));
  };
  U.noise2 = (x, y, seed = 0) => {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const s = seed * 1013;
    const a = U.hash2(ix + s, iy), b = U.hash2(ix + 1 + s, iy);
    const c = U.hash2(ix + s, iy + 1), d = U.hash2(ix + 1 + s, iy + 1);
    const ux = sm(fx), uy = sm(fy);
    return U.lerp(U.lerp(a, b, ux), U.lerp(c, d, ux), uy);
  };

  U.fbm2 = (x, y, oct = 4, seed = 0) => {
    let v = 0, amp = 0.5, norm = 0;
    for (let o = 0; o < oct; o++) {
      v += amp * U.noise2(x, y, seed + o * 17);

    }
    return v / norm;
  };

  U.wobble = (x, seed = 0) => U.noise1(x, seed) * 2 - 1;

  /* ---------- colour ---------- */
  const hexCache = new Map();
  U.hexToRgb = (hex) => {
    let c = hexCache.get(hex);
    if (c) return c;
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map((ch) => ch + ch).join('');
    const n = parseInt(h, 16);
    c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    hexCache.set(hex, c);
    return c;
  };
  U.rgbToHex = (r, g, b) =>
    '#' + [r, g, b].map((v) => Math.round(U.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
  /** '#rrggbb' + alpha → 'rgba(...)' */
  U.rgba = (hex, a = 1) => {
    const [r, g, b] = U.hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  };
  /** Mix two hex colours, t in 0..1 → hex. */
  U.mix = (h1, h2, t) => {
    const a = U.hexToRgb(h1), b = U.hexToRgb(h2);
    return U.rgbToHex(U.lerp(a[0], b[0], t), U.lerp(a[1], b[1], t), U.lerp(a[2], b[2], t));
  };
  /** Multiply-darken a hex colour by k (0..1 darker, >1 lighter). */
  U.shade = (hex, k) => {
    const [r, g, b] = U.hexToRgb(hex);
    return U.rgbToHex(r * k, g * k, b * k);
  };

  /* ---------- geometry ---------- */
  U.dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  /** Point on quadratic bezier. */
  U.qbez = (p0, p1, p2, t) => {
    const u = 1 - t;
    return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]];
  };
  /** Point on cubic bezier. */
  U.cbez = (p0, p1, p2, p3, t) => {
    const u = 1 - t;
    const a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
    return [a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0], a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1]];
  };
})(window.TSUKI = window.TSUKI || {});

  /* basic shapes                                                        */
  /* ------------------------------------------------------------------ */

    g.addColorStop(solid / (solid + fade), U.rgba(color, alpha));
    g.addColorStop(Math.min(1, (solid + fade * 0.45) / (solid + fade)), U.rgba(color, alpha * 0.28));
    g.addColorStop(1, U.rgba(color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, solid + fade);
    ctx.restore();
  };

  /** Horizontal horizon glow band (e.g. dusk light behind mountains). */
  B.horizonGlow = (ctx, y, h, color, alpha = 0.6, w = 1920) => {
    ctx.save();
    const g = ctx.createLinearGradient(0, y - h, 0, y + h);
    g.addColorStop(0, U.rgba(color, 0));
    g.addColorStop(0.5, U.rgba(color, alpha));
    g.addColorStop(1, U.rgba(color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, y - h, w, h * 2);
    ctx.restore();
  };

  /* ------------------------------------------------------------------ */
  /* kasumi — mist bands                                                 */
  /* ------------------------------------------------------------------ */
  /**
   * 霞 band: a long flat bar with rounded ends, as printed in ukiyo-e and
   * painted in emaki (すやり霞). Crisp by default; `soft` (0..1) feathers the
   * ends, `fade` (0..1) fades the lower edge (bokashi).
   * seed makes the top/bottom edges gently irregular.
   * Sprite-cached per size: for widths that animate every frame use B.band.
   */
  B.kasumi = (ctx, x, y, w, h, color, alpha = 1, opts = {}) => {
    const soft = opts.soft == null ? 0 : opts.soft;
    const fade = opts.fade == null ? 0.35 : opts.fade;
    const seed = opts.seed == null ? 1 : opts.seed;
    const W = Math.round(U.clamp(w, 8, 3200)), H = Math.round(U.clamp(h, 4, 600));
    const key = `kasumi|${W}|${H}|${color}|${soft}|${fade}|${seed}`;
    const spr = B.sprite(key, W + 4, H + 4, (c, cw, ch) => {
      const r = U.rng(seed);
      const rad = H / 2;
      // irregular capsule
      const top = [], bot = [];
      const N = Math.max(6, Math.round(W / 80));
      for (let i = 0; i <= N; i++) {
        const px = 2 + rad + (W - 2 * rad) * (i / N);
        top.push([px, 2 + H * 0.06 * r()]);
        bot.push([px, 2 + H - H * 0.06 * r()]);
      }
      c.beginPath();
      c.moveTo(top[0][0], top[0][1]);
      for (let i = 1; i < top.length; i++) c.lineTo(top[i][0], top[i][1]);
      c.arc(2 + W - rad, 2 + rad, rad * 0.98, -Math.PI / 2, Math.PI / 2);
      for (let i = bot.length - 1; i >= 0; i--) c.lineTo(bot[i][0], bot[i][1]);
      c.arc(2 + rad, 2 + rad, rad * 0.98, Math.PI / 2, Math.PI * 1.5);
      c.closePath();
      const g = c.createLinearGradient(0, 2, 0, 2 + H);
      g.addColorStop(0, U.rgba(color, 1));
      g.addColorStop(0.55, U.rgba(color, 1));
      g.addColorStop(1, U.rgba(color, 1 - fade));
      c.fillStyle = g;
      c.fill();
      if (soft > 0) {
        c.globalCompositeOperation = 'destination-in';
        const e = Math.min(0.49, soft * 0.5);
        const hg = c.createLinearGradient(0, 0, cw, 0);
        hg.addColorStop(0, 'rgba(0,0,0,0)');
        hg.addColorStop(e, 'rgba(0,0,0,1)');
        hg.addColorStop(1 - e, 'rgba(0,0,0,1)');
        hg.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = hg;
        c.fillRect(0, 0, cw, ch);
      }
    });
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.drawImage(spr, x - 2, y - 2, w + 4, h + 4);
    ctx.restore();
  };

  /**
   * Plain animated mist band (no sprite, safe for widths that change every
   * frame): rounded bar with a vertical bokashi toward the bottom edge.
   */
  B.band = (ctx, x, y, w, h, color, alpha = 1, fade = 0.3) => {
    if (w <= 1 || h <= 1 || alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha *= alpha;
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, U.rgba(color, 1));
    g.addColorStop(0.6, U.rgba(color, 1));
    g.addColorStop(1, U.rgba(color, 1 - fade));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, Math.min(h / 2, w / 2));
    ctx.fill();
    ctx.restore();
  };

  /**
   * A stacked bank of kasumi bands (the classic stepped mist), drifting
   * horizontally with `drift` px. rows: number of bands.
   */
  B.kasumiBank = (ctx, x, y, w, rowH, rows, color, alpha = 1, seed = 1, drift = 0, opts = {}) => {
    const r = U.rng(seed);
    for (let i = 0; i < rows; i++) {
      const bw = w * U.lerp(0.45, 0.9, r());
      const bx = x + (w - bw) * r() + drift * U.lerp(0.6, 1.2, r());
      const by = y + i * rowH * 0.78 + rowH * 0.2 * r();
      B.kasumi(ctx, bx, by, bw, rowH * U.lerp(0.6, 0.95, r()), color, alpha * U.lerp(0.75, 1, r()), {
        seed: seed * 31 + i, soft: opts.soft, fade: opts.fade,
      });
    }
  };

  /* ------------------------------------------------------------------ */
  /* the moon                                                            */
  /* ------------------------------------------------------------------ */
  /** Stylised moon-rabbit (兎の餅つき) maria silhouette in unit space (r=1). */
  const rabbitMaria = (c, r) => {
    c.save();
    c.scale(r, r);
    c.beginPath();
    // body
    c.ellipse(-0.18, 0.16, 0.2, 0.26, -0.35, 0, U.TAU);
    // head
    c.moveTo(-0.02, -0.12);
    c.ellipse(-0.06, -0.16, 0.11, 0.1, 0, 0, U.TAU);
    // ears
    c.moveTo(-0.12, -0.28);
    c.ellipse(-0.16, -0.4, 0.045, 0.17, -0.35, 0, U.TAU);
    c.moveTo(-0.04, -0.3);
    c.ellipse(-0.06, -0.42, 0.04, 0.16, 0.05, 0, U.TAU);
    // mortar (usu)
    c.moveTo(0.18, 0.18);
    c.ellipse(0.33, 0.2, 0.17, 0.06, 0, 0, U.TAU);
    c.moveTo(0.18, 0.2);
    c.rect(0.2, 0.2, 0.26, 0.3);
    // arm + pestle (kine)
    c.moveTo(0.02, 0.0);
    c.ellipse(0.1, -0.02, 0.1, 0.035, -0.5, 0, U.TAU);
    c.moveTo(0.24, -0.26);
    c.ellipse(0.24, -0.02, 0.028, 0.24, 0.25, 0, U.TAU);
    // mare wash around them
    c.moveTo(0.0, 0.62);
    c.ellipse(-0.3, 0.55, 0.3, 0.14, 0.2, 0, U.TAU);
    c.moveTo(0.5, -0.45);
    c.ellipse(0.42, -0.5, 0.16, 0.12, 0.4, 0, U.TAU);
    c.fill();
    c.restore();
  };

  /**
   * 名月. opts:
   *   color   — disc ink (default 月色)
   *   rim     — rim tint colour for bokashi edge (default 金茶)
   *   halo    — 0..1 strength of the soft halo (月暈)
   *   haloColor, haloR (multiple of r, default 2.6)
   *   maria   — 0..1 strength of the rabbit maria
   *   mica    — time in seconds to animate kira-zuri sparkle (false = none)
   *   outline — sumi outline alpha (0 = none)
   *   alpha   — overall alpha
   */
  B.moon = (ctx, x, y, r, opts = {}) => {
    const color = opts.color || C.tsukiKi;
    const rim = opts.rim || C.kin;
    const halo = opts.halo == null ? 0.5 : opts.halo;
    const haloColor = opts.haloColor || color;
    const alpha = opts.alpha == null ? 1 : opts.alpha;
    const maria = opts.maria == null ? 0.12 : opts.maria;
    ctx.save();
    ctx.globalAlpha *= alpha;
    if (halo > 0) {
      const hr = r * (opts.haloR || 2.6);
      const g = ctx.createRadialGradient(x, y, r * 0.95, x, y, hr);
      g.addColorStop(0, U.rgba(haloColor, 0.42 * halo));
      g.addColorStop(0.18, U.rgba(haloColor, 0.2 * halo));
      g.addColorStop(0.5, U.rgba(haloColor, 0.06 * halo));
      g.addColorStop(1, U.rgba(haloColor, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, hr, 0, U.TAU);
      ctx.fill();
    }
    // disc with bokashi rim, rendered once per (size bucket,color,rim,maria)
    // as a sprite and scaled to r, so an animated radius does not re-render.
    const R = Math.max(8, Math.ceil(r / 24) * 24);
    const key = `moon|${R}|${color}|${rim}|${Math.round(maria * 100)}`;
    const spr = B.sprite(key, R * 2 + 4, R * 2 + 4, (c) => {
      const cx = R + 2, cy = R + 2;
      c.save();
      c.beginPath();
      c.arc(cx, cy, R, 0, U.TAU);
      c.clip();
      const g = c.createRadialGradient(cx - R * 0.18, cy - R * 0.2, R * 0.05, cx, cy, R);
      g.addColorStop(0, U.mix(color, '#ffffff', 0.35));
      g.addColorStop(0.72, color);
      g.addColorStop(1, U.mix(color, rim, 0.55));
      c.fillStyle = g;
      c.fillRect(0, 0, R * 2 + 4, R * 2 + 4);
      // mottled mare texture
      const rr = U.rng(R * 13 + 7);
      for (let i = 0; i < 26; i++) {
        const a = rr() * U.TAU, d = Math.sqrt(rr()) * R * 0.85;
        const px = cx + Math.cos(a) * d, py = cy + Math.sin(a) * d;
        const pr = R * U.lerp(0.06, 0.22, rr());
        const mg = c.createRadialGradient(px, py, 0, px, py, pr);
        mg.addColorStop(0, U.rgba(rim, 0.1 + maria * 0.25));
        mg.addColorStop(1, U.rgba(rim, 0));
        c.fillStyle = mg;
        c.fillRect(px - pr, py - pr, pr * 2, pr * 2);
      }
      if (maria > 0) {
        c.translate(cx, cy);
        c.fillStyle = U.rgba(U.shade(rim, 0.85), maria);
        c.filter = `blur(${Math.max(1, R * 0.03)}px)`;
        rabbitMaria(c, R);
        c.filter = 'none';
      }
      c.restore();
    });
    const sc = r / R;
    ctx.drawImage(spr, x - (R + 2) * sc, y - (R + 2) * sc, (R * 2 + 4) * sc, (R * 2 + 4) * sc);
    if (opts.outline) {
      ctx.strokeStyle = U.rgba(C.sumi, opts.outline);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, U.TAU);
      ctx.stroke();
    }
    if (opts.mica !== undefined && opts.mica !== false) {
      // kira-zuri: sparse mica glints that breathe slowly
      const t = opts.mica;
      const rr = U.rng(911);
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 60; i++) {
        const a = rr() * U.TAU, d = Math.sqrt(rr()) * r * 0.96;
        const ph = rr() * U.TAU, sp = U.lerp(0.4, 1.3, rr());
        const tw = Math.pow(Math.max(0, Math.sin(t * sp + ph)), 8);
        if (tw < 0.02) continue;
        ctx.globalAlpha = alpha * tw * 0.55;
        const s = U.lerp(0.8, 2.2, rr());
        ctx.fillRect(x + Math.cos(a) * d - s / 2, y + Math.sin(a) * d - s / 2, s, s);
      }
    }
    ctx.restore();
  };

  /** Moon reflection on water: a wavering column of horizontal strokes. */
  B.moonReflection = (ctx, x, y0, y1, width, t, color, alpha = 0.8, seed = 3) => {
    ctx.save();
    const rows = Math.max(4, Math.round((y1 - y0) / 9));
    for (let i = 0; i < rows; i++) {
      const s = i / (rows - 1);
      const y = y0 + (y1 - y0) * s;
      const w = width * U.lerp(1, 0.25, s) * (0.6 + 0.4 * U.noise1(i * 0.7 + t * 1.3, seed));
      const off = U.wobble(i * 0.37 + t * 0.9, seed + 5) * width * 0.35 * (0.3 + s);
      const a = alpha * U.lerp(1, 0.15, s) * (0.55 + 0.45 * U.noise1(i * 1.3 - t * 2, seed + 9));
      ctx.fillStyle = U.rgba(color, a);
      const h = U.lerp(4, 2, s);
      ctx.beginPath();
      ctx.ellipse(x + off, y, w / 2, h, 0, 0, U.TAU);
      ctx.fill();
    }
    ctx.restore();
  };

  /* ------------------------------------------------------------------ */
  /* clouds                                                              */
  /* ------------------------------------------------------------------ */
  /**
   * Stylised ukiyo-e cloud: flat underside, lobed top. opts:
   *   fill, alpha, outline (sumi alpha), lobes, seed, shade (inner bokashi colour)
   */
  B.cloud = (ctx, x, y, w, h, opts = {}) => {
    const r = U.rng(opts.seed || 7);
    const lobes = opts.lobes || Math.max(3, Math.round(w / h / 0.9));
    const fill = opts.fill || C.gofun;
    ctx.save();
    ctx.globalAlpha *= opts.alpha == null ? 1 : opts.alpha;
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    let px = x;
    for (let i = 0; i < lobes; i++) {
      const lw = (w / lobes) * U.lerp(0.8, 1.2, r());
      const nx = i === lobes - 1 ? x + w : Math.min(x + w, px + lw);
      const lh = h * U.lerp(0.55, 1, r()) * (1 - Math.abs(i / (lobes - 1 || 1) - 0.5) * 0.5);
      const cx = (px + nx) / 2;
      ctx.bezierCurveTo(px - lw * 0.05, y + h - lh * 1.3, nx + lw * 0.05, y + h - lh * 1.3, nx, y + h - (i === lobes - 1 ? 0 : h * 0.12));
      void cx;
      px = nx;
    }
    ctx.closePath();
    if (opts.shade) {
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, fill);
      g.addColorStop(1, opts.shade);
      ctx.fillStyle = g;
    } else ctx.fillStyle = fill;
    ctx.fill();
    if (opts.outline) {
      ctx.strokeStyle = U.rgba(C.sumi, opts.outline);
      ctx.lineWidth = opts.lineWidth || 2;
      ctx.lineJoin = 'round';
      ctx.stroke();
    }
    ctx.restore();
  };

  /* ------------------------------------------------------------------ */
  /* grasses — 薄 (susuki) & autumn field                                */
  /* ------------------------------------------------------------------ */
  /**
   * A clump of susuki (pampas grass) rooted at (x,y), height h.
   * opts: t, seed, wind (0..1), lean (radians), blades, plumes,
   *       blade (colour), plume (colour), outline (colour|null), alpha
   */
  B.susuki = (ctx, x, y, h, opts = {}) => {
    const t = opts.t || 0, seed = opts.seed || 1;
    const r = U.rng(seed);
    const wind = opts.wind == null ? 0.5 : opts.wind;
    const lean = opts.lean || 0;
    const bladeCol = opts.blade || C.koke;
    const plumeCol = opts.plume || C.susuki;
    const nBlades = opts.blades || 9;
    const nPlumes = opts.plumes == null ? 4 : opts.plumes;
    ctx.save();
    ctx.globalAlpha *= opts.alpha == null ? 1 : opts.alpha;
    const gust = (k) => wind * (0.55 * Math.sin(t * 0.8 + k) + 0.45 * U.wobble(t * 0.35 + k * 3, seed));
    // blades
    for (let i = 0; i < nBlades; i++) {
      const bl = h * U.lerp(0.45, 0.85, r());
      const ang = lean + U.lerp(-0.55, 0.55, r()) + gust(i * 0.7) * 0.12;
      const bend = U.lerp(0.25, 0.7, r()) * (r() < 0.5 ? -1 : 1);
      const ex = x + Math.sin(ang) * bl + bend * bl * 0.35;
      const ey = y - Math.cos(ang) * bl * 0.8 + bl * 0.15 * Math.abs(bend);
      const cx = x + Math.sin(ang) * bl * 0.55, cy = y - Math.cos(ang) * bl * 0.75;
      B.taper(ctx, B.qpts(x + U.lerp(-4, 4, r()), y, cx, cy, ex, ey, 14), U.lerp(3, 6, r()), 0.4, bladeCol, 0.2);
    }
    // plumes (尾花)
    for (let i = 0; i < nPlumes; i++) {
      const sl = h * U.lerp(0.8, 1.05, r());
      const baseAng = lean + U.lerp(-0.25, 0.25, r());
      const sway = gust(i * 1.9 + 11) * 0.22;
      const ang = baseAng + sway;
      const tipX = x + Math.sin(ang) * sl, tipY = y - Math.cos(ang) * sl;
      const cX = x + Math.sin(baseAng) * sl * 0.5, cY = y - Math.cos(baseAng) * sl * 0.55;
      const stem = B.qpts(x, y, cX, cY, tipX, tipY, 16);
      B.taper(ctx, stem, 2.2, 1.0, U.mix(bladeCol, plumeCol, 0.4), 0);
      // drooping head: a fan of fine hairs from the upper 30% of the stem
      const droop = U.lerp(0.5, 1.1, r()) + sway * 1.5;
      const hairs = 16;
      for (let k = 0; k < hairs; k++) {
        const s = U.lerp(0.68, 1, k / (hairs - 1));
        const p = stem[Math.round(s * (stem.length - 1))];
        const hl = h * U.lerp(0.1, 0.2, r()) * (1 - (s - 0.68) * 1.2);
        const ha = ang + droop * U.lerp(0.35, 1, (s - 0.68) / 0.32) + U.lerp(-0.25, 0.25, r());
        const ex = p[0] + Math.sin(ha) * hl, ey = p[1] - Math.cos(ha) * hl;
        const mx = p[0] + Math.sin(ha - 0.35) * hl * 0.5, my = p[1] - Math.cos(ha - 0.35) * hl * 0.5;
        B.taper(ctx, B.qpts(p[0], p[1], mx, my, ex, ey, 6), 2.2, 0.3, U.rgba(plumeCol, U.lerp(0.65, 1, r())), 0.35);
      }
    }
    if (opts.outline) {
      ctx.globalAlpha *= 0.5;
    }
    ctx.restore();
  };

  /** A field of susuki clumps spread across [x0,x1] along baseline y. */
  B.susukiField = (ctx, x0, x1, y, h, n, opts = {}) => {
    const r = U.rng(opts.seed || 5);
    for (let i = 0; i < n; i++) {
      const px = U.lerp(x0, x1, (i + r() * 0.8) / n);
      B.susuki(ctx, px, y + U.lerp(-6, 10, r()), h * U.lerp(0.7, 1.15, r()), {
        ...opts, seed: (opts.seed || 5) * 100 + i, lean: (opts.lean || 0) + U.lerp(-0.15, 0.15, r()),
      });
    }
  };

  /* ------------------------------------------------------------------ */
  /* water                                                               */
  /* ------------------------------------------------------------------ */
  /** Broken horizontal ripple strokes over a region, drifting with t. */
  B.ripples = (ctx, x, y, w, h, t, color, alpha = 0.5, seed = 2, density = 1) => {
    ctx.save();
    const r = U.rng(seed);
    const n = Math.round((w * h) / 9000 * density);
    for (let i = 0; i < n; i++) {
      const yy = y + h * Math.pow(r(), 0.85);
      const persp = U.lerp(0.4, 1.4, (yy - y) / h);
      const len = U.lerp(20, 90, r()) * persp;
      const speed = U.lerp(4, 14, r());
      const xx = x + ((r() * w + t * speed) % (w + len)) - len;
      const a = alpha * (0.4 + 0.6 * Math.max(0, Math.sin(t * U.lerp(0.4, 1.1, r()) + r() * 6)));
      ctx.strokeStyle = U.rgba(color, a);
      ctx.lineWidth = U.lerp(1, 2.6, r()) * persp;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(xx, yy);
      ctx.quadraticCurveTo(xx + len / 2, yy - 2 * persp, xx + len, yy);
      ctx.stroke();
    }
    ctx.restore();
  };

  /** 青海波 wave rows drawn directly (for large decorative seas). */
  B.seigaiha = (ctx, x, y, w, h, r, fg, bg, lineW = 2) => {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    const rows = Math.ceil(h / (r * 0.5)) + 2;
    for (let j = -1; j < rows; j++) {
      const yy = y + j * r * 0.5;
      const off = j % 2 === 0 ? 0 : r;
      for (let xx = x - r * 2 + off; xx < x + w + r * 2; xx += r * 2) {
        for (let k = 4; k >= 1; k--) {
          ctx.beginPath();
          ctx.arc(xx, yy + r, (r * k) / 4, Math.PI, 0);
          ctx.fillStyle = k % 2 === 0 ? bg : fg;
          ctx.fill();
          ctx.strokeStyle = fg;
          ctx.lineWidth = lineW;
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  };

  /* ------------------------------------------------------------------ */
  /* land                                                                */
  /* ------------------------------------------------------------------ */
  /**
   * Mountain ridge: noise-generated skyline from x0..x1 around baseline
   * `y` with amplitude `amp`, filled down to `bottom` with a bokashi fade
   * (colour at the ridge, fading to `fadeTo` alpha at the bottom).
   */
  B.ridge = (ctx, x0, x1, y, amp, color, opts = {}) => {
    const seed = opts.seed || 1, freq = opts.freq || 0.004;
    const bottom = opts.bottom || 1080;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x0, bottom);
    for (let x = x0; x <= x1 + 8; x += 8) {
      const n = U.fbm2(x * freq, seed * 3.1, 4, seed);
      const peak = opts.peaks ? opts.peaks(x) : 0;
      ctx.lineTo(x, y - (n - 0.35) * amp - peak);
    }
    ctx.lineTo(x1, bottom);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, y - amp, 0, bottom);
    g.addColorStop(0, U.rgba(color, opts.alpha == null ? 1 : opts.alpha));
    g.addColorStop(opts.solid == null ? 0.35 : opts.solid, U.rgba(color, opts.alpha == null ? 1 : opts.alpha));
    g.addColorStop(1, U.rgba(color, opts.fadeTo == null ? 0.15 : opts.fadeTo));
    ctx.fillStyle = g;
    ctx.fill();
    if (opts.outline) {
      ctx.strokeStyle = U.rgba(C.sumi, opts.outline);
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.restore();
  };

  /**
   * 富士 — the iconic cone with a snow cap of jagged fingers.
   * (cx, baseY) bottom centre; w base width; h height.
   */
  B.fuji = (ctx, cx, baseY, w, h, opts = {}) => {
    const body = opts.color || C.bero;
    const snow = opts.snow || C.gofun;
    const topW = w * 0.09;
    const peakY = baseY - h;
    const slope = (s) => Math.pow(s, 1.55); // concave flanks
    const pts = [];
    const N = 40;
    for (let i = 0; i <= N; i++) {
      const s = i / N;
      pts.push([cx - topW / 2 - (w / 2 - topW / 2) * s, peakY + h * slope(s)]);
    }
    const right = pts.map((p) => [2 * cx - p[0], p[1]]).reverse();
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(right[right.length - 1][0], right[right.length - 1][1]);
    // crater notches along the flat top
    const notch = [[-0.5, 0], [-0.3, 0.012], [-0.12, -0.004], [0.05, 0.014], [0.22, 0], [0.5, 0]];
    for (const [nx, ny] of notch) ctx.lineTo(cx + nx * topW, peakY + ny * h);
    for (const p of right) ctx.lineTo(p[0], p[1]);
    ctx.lineTo(cx - w / 2, baseY);
    for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, peakY, 0, baseY);
    g.addColorStop(0, opts.top || U.shade(body, 0.75));
    g.addColorStop(1, opts.bottom || U.rgba(body, opts.baseAlpha == null ? 0.25 : opts.baseAlpha));
    ctx.fillStyle = g;
    ctx.fill();
    if (opts.outline) {
      ctx.strokeStyle = U.rgba(C.sumi, opts.outline);
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.clip();
    if (snow) {
      // snow cap: fingers reaching down the flanks
      const r = U.rng(opts.seed || 22);
      const capH = h * (opts.capH || 0.3);
      ctx.beginPath();
      ctx.moveTo(cx - w, peakY - 10);
      ctx.lineTo(cx + w, peakY - 10);
      const fingers = 11;
      for (let i = fingers; i >= 0; i--) {
        const s = i / fingers; // 1 → 0 : right to left
        const xx = cx + U.lerp(-1, 1, s) * (topW / 2 + w * 0.18);
        const deep = capH * U.lerp(0.45, 1.15, r()) * (1 - Math.abs(s - 0.5) * 0.6);
        ctx.lineTo(xx + w * 0.012, peakY + deep * 0.55);
        ctx.lineTo(xx, peakY + deep);
        ctx.lineTo(xx - w * 0.012, peakY + deep * 0.5);
      }
      ctx.closePath();
      ctx.fillStyle = U.rgba(snow, opts.snowAlpha == null ? 1 : opts.snowAlpha);
      ctx.fill();
    }
    ctx.restore();
  };

  /* ------------------------------------------------------------------ */
  /* creatures                                                           */
  /* ------------------------------------------------------------------ */
  /**
   * 雁 — flying goose in silhouette (Hiroshige, 月に雁). Heading left when
   * dir = -1. phase in radians drives the wingbeat.
   */
  B.goose = (ctx, x, y, s, phase, color = C.sumi, dir = -1, alpha = 1) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s * dir * -1, s);
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    const beat = Math.sin(phase);
    // body + neck + head, heading to +x (flipped by dir)
    ctx.beginPath();
    ctx.ellipse(0, 0, 26, 8, -0.05, 0, U.TAU);
    ctx.fill();
    B.taper(ctx, [[18, -2], [34, -6], [46, -8]], 7, 4, color, 0);
    ctx.beginPath();
    ctx.ellipse(49, -8.5, 5.5, 4, -0.1, 0, U.TAU);
    ctx.fill();
    B.poly(ctx, [[53, -9], [62, -7.5], [53, -6.5]]);
    ctx.fill();
    // tail
    B.poly(ctx, [[-24, -3], [-36, -1], [-35, 4], [-22, 4]]);
    ctx.fill();
    // wings: far wing (lighter) and near wing
    const wing = (lift, k) => {
      const tipY = -lift * 46;
      ctx.beginPath();
      ctx.moveTo(10, -2);
      ctx.quadraticCurveTo(0, tipY * 0.6 - 6, -18 * k, tipY);
      ctx.quadraticCurveTo(-8, tipY * 0.35, -12, 1);
      ctx.closePath();
      ctx.fill();
    };
    ctx.globalAlpha *= 0.85;
    wing(beat * 0.9 + 0.2, 0.9);
    ctx.globalAlpha /= 0.85;
    wing(-beat * 0.2 + beat, 1.15);
    ctx.restore();
  };

  /* ------------------------------------------------------------------ */
  /* patterns (textiles)                                                 */
  /* ------------------------------------------------------------------ */
  const patCache = new Map();
  /**
   * CanvasPattern for a textile motif. name: 'seigaiha' | 'asanoha' |
   * 'same' | 'kikko' | 'yagasuri' | 'shippo' | 'kumo'. fg/bg are hex.
   * size = tile size in px. The pattern is created against `ctx`.
   */
  B.pattern = (ctx, name, fg, bg, size = 24) => {
    const key = `${name}|${fg}|${bg}|${size}`;
    let tile = patCache.get(key);
    if (!tile) {
      tile = B.canvas(size * 2, size * 2);
      const c = tile.getContext('2d');
      const S = size * 2;
      c.fillStyle = bg;
      c.fillRect(0, 0, S, S);
      c.strokeStyle = fg;
      c.fillStyle = fg;
      c.lineWidth = Math.max(1, size / 14);
      if (name === 'seigaiha') {
        const r = size / 2;
        for (let j = -1; j < 5; j++) {
          for (let i = -1; i < 3; i++) {
            const xx = i * size + (j % 2 ? r : 0), yy = j * r * 0.5 + r;
            for (let k = 3; k >= 1; k--) {
              c.beginPath();
              c.arc(xx + r, yy, (r * k) / 3, Math.PI, 0);
              c.fillStyle = bg;
              c.fill();
              c.stroke();
            }
          }
        }
      } else if (name === 'asanoha') {
        const h = S / 2, w = S / 2;
        const star = (cx, cy) => {
          for (let k = 0; k < 6; k++) {
            const a = (k * Math.PI) / 3;
            c.beginPath();
            c.moveTo(cx, cy);
            c.lineTo(cx + Math.cos(a) * w * 0.6, cy + Math.sin(a) * w * 0.6);
            c.stroke();
          }
        };
        star(w / 2, h / 2); star(w * 1.5, h / 2); star(w / 2, h * 1.5); star(w * 1.5, h * 1.5); star(w, h);
      } else if (name === 'same') {
        const n = 6;
        for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
          c.beginPath();
          c.arc((i + (j % 2) * 0.5) * (S / n), (j + 0.5) * (S / n), S / n / 5, 0, U.TAU);
          c.fill();
        }
      } else if (name === 'kikko') {
        const r = S / 4;
        const hex = (cx, cy) => {
          c.beginPath();
          for (let k = 0; k < 6; k++) {
            const a = Math.PI / 6 + (k * Math.PI) / 3;
            const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
            k ? c.lineTo(px, py) : c.moveTo(px, py);
          }
          c.closePath();
          c.stroke();
        };
        const dx = r * Math.sqrt(3);
        for (let j = -1; j < 4; j++) for (let i = -1; i < 4; i++) hex(i * dx + (j % 2 ? dx / 2 : 0), j * r * 1.5);
      } else if (name === 'yagasuri') {
        for (let i = 0; i < 2; i++) {
          const x0 = i * size;
          c.fillStyle = i % 2 ? fg : bg;
          c.beginPath();
          c.moveTo(x0, 0); c.lineTo(x0 + size, size * 0.5); c.lineTo(x0 + size, size * 1.5); c.lineTo(x0, size); c.closePath();
          c.fill();
          c.fillStyle = i % 2 ? bg : fg;
          c.beginPath();
          c.moveTo(x0, size); c.lineTo(x0 + size, size * 1.5); c.lineTo(x0 + size, S + size * 0.5); c.lineTo(x0, S); c.closePath();
          c.fill();
        }
      } else if (name === 'shippo') {
        const r = S / 4;
        for (const [cx, cy] of [[0, 0], [S / 2, 0], [S, 0], [0, S / 2], [S / 2, S / 2], [S, S / 2], [0, S], [S / 2, S], [S, S], [S / 4, S / 4], [S * 0.75, S * 0.25], [S / 4, S * 0.75], [S * 0.75, S * 0.75]]) {
          c.beginPath();
          c.arc(cx, cy, r, 0, U.TAU);
          c.stroke();
        }
      } else if (name === 'kumo') {
        c.globalAlpha = 0.9;
        for (let k = 0; k < 3; k++) {
          c.beginPath();
          c.arc(S * 0.3 + k * S * 0.15, S * 0.55, S * 0.12, Math.PI, 0);
          c.stroke();
        }
      }
      patCache.set(key, tile);
    }
    return ctx.createPattern(tile, 'repeat');
  };

  /* ------------------------------------------------------------------ */
  /* seals & particles                                                   */
  /* ------------------------------------------------------------------ */
  /** 朱印 — vermilion seal with white characters (1–4 chars, square). */
  B.seal = (ctx, x, y, size, text, color = C.shu, alpha = 1) => {
    ctx.save();
    ctx.globalAlpha *= alpha;
    const r = U.rng(text.charCodeAt(0));
    ctx.fillStyle = color;
    ctx.beginPath();
    const j = size * 0.04;
    ctx.moveTo(x + r() * j, y + r() * j);
    ctx.lineTo(x + size - r() * j, y + r() * j);
    ctx.lineTo(x + size - r() * j, y + size - r() * j);
    ctx.lineTo(x + r() * j, y + size - r() * j);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = TSUKI.C.gofun;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const chars = [...text];
    if (chars.length === 1) {
      ctx.font = `${size * 0.72}px "Shippori Mincho B1", "Yu Mincho", serif`;
      ctx.fillText(chars[0], x + size / 2, y + size / 2 + size * 0.03);
    } else {
      // 2 → one column; 4 → two columns read right-to-left
      const cols = chars.length > 2 ? 2 : 1;
      const rows = Math.ceil(chars.length / cols);
      const fs = (size * 0.86) / rows;
      ctx.font = `${fs}px "Shippori Mincho B1", "Yu Mincho", serif`;
      chars.forEach((ch, i) => {
        const col = Math.floor(i / rows), row = i % rows;
        const cx = cols === 1 ? x + size / 2 : x + size * (0.73 - col * 0.46);
        ctx.fillText(ch, cx, y + size * 0.07 + fs * (row + 0.5));
      });
    }
    ctx.restore();
  };

  /**
   * Deterministic drifting particle i at time t (falling leaves, petals,
   * embers, fireflies…). Returns {x,y,rot,life} or null when not alive.
   * opts: seed, area [x,y,w,h], vx, vy (px/s), sway (px), period (s),
   *       spin (rad/s), wrap (true: loops forever)
   */
  B.drift = (i, t, opts) => {
    const seed = (opts.seed || 1) * 7919 + i * 131;
    const h0 = U.hash(seed), h1 = U.hash(seed + 1), h2 = U.hash(seed + 2), h3 = U.hash(seed + 3);
    const [ax, ay, aw, ah] = opts.area || [0, 0, 1920, 1080];
    const vx = (opts.vx || 0) * U.lerp(0.7, 1.3, h2);
    const vy = (opts.vy || 40) * U.lerp(0.7, 1.3, h3);
    const period = opts.period || (ah + 200) / Math.max(1, Math.abs(vy));
    const tt = t + h0 * period;
    const cyc = Math.floor(tt / period);
    const lt = tt - cyc * period; // local time in this lap
    const cx = U.hash(seed + cyc * 17);
    let x = ax + cx * aw + vx * lt + Math.sin(lt * U.lerp(0.6, 1.4, h1) + h2 * 9) * (opts.sway || 30);
    let y = ay - 100 + vy * lt;
    if (vy < 0) y = ay + ah + 100 + vy * lt;
    const rot = (opts.spin || 1) * lt * U.lerp(-1.5, 1.5, h1) + h3 * 6;
    return { x, y, rot, life: lt / period, k: h1, lap: cyc };
  };
})(window.TSUKI = window.TSUKI || {});

</script>
<script>
/* ==========================================================================
   paper.js — washi & print finish, applied over every frame.
   A single texture is generated once (deterministically) at stage size:
   kozo fibres, pulp mottling and aged edges (焼け). The engine multiplies
   it over the finished frame, which binds every scene into one "print".
   ========================================================================== */
(function (TSUKI) {
  'use strict';

  const U = TSUKI.U, B = TSUKI.B;
  const P = (TSUKI.PAPER = {});

  let grain = null;   // multiply layer (paper tone + fibres + mottling)
  let light = null;   // screen layer (tiny bright flecks of gofun)

  /** Build textures at logical size (default 1920×1080). ~60–120ms once. */
  P.build = (W = 1920, H = 1080) => {
    // work at half resolution for the noise, upscale smoothly: washi mottling
    // is low-frequency, and fibres are drawn as vectors at full resolution.
    const w = Math.ceil(W / 2), h = Math.ceil(H / 2);
    const low = B.canvas(w, h);
    const lc = low.getContext('2d');
    const img = lc.createImageData(w, h);
    const d = img.data;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const m = U.fbm2(x / 90, y / 90, 4, 3);          // pulp clouds
        const f = U.hash2(x * 1.7, y * 2.3);              // fine grain
        const nx = x / w - 0.5, ny = y / h - 0.5;
        const edge = Math.pow(Math.min(1, Math.hypot(nx * 1.1, ny * 1.25) * 1.55), 3.2); // 焼け
        let v = 250 - (m - 0.5) * 22 - f * 10 - edge * 30;
        // warm tint: multiply layer, so white = no change
        d[i] = U.clamp(v + 2, 0, 255);
        d[i + 1] = U.clamp(v - 3 - edge * 6, 0, 255);
        d[i + 2] = U.clamp(v - 14 - edge * 16, 0, 255);
        d[i + 3] = 255;
      }
    }
    lc.putImageData(img, 0, 0);

    grain = B.canvas(W, H);
    const g = grain.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(low, 0, 0, W, H);
    // kozo fibres: long, thin, faintly darker hairs
    const r = U.rng(77);
    g.lineCap = 'round';
    for (let i = 0; i < 900; i++) {
      const x = r() * W, y = r() * H, len = U.lerp(12, 70, r()), a = r() * Math.PI;
      const bend = U.lerp(-8, 8, r());
      g.strokeStyle = `rgba(150,128,96,${U.lerp(0.05, 0.16, r())})`;
      g.lineWidth = U.lerp(0.4, 1.1, r());
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(a) * len * 0.5 + bend, y + Math.sin(a) * len * 0.5 - bend, x + Math.cos(a) * len, y + Math.sin(a) * len);
      g.stroke();
    }
    // a few fibre clumps
    for (let i = 0; i < 40; i++) {
      const x = r() * W, y = r() * H;
      g.fillStyle = `rgba(160,140,110,${U.lerp(0.03, 0.08, r())})`;
      g.beginPath();
      g.ellipse(x, y, U.lerp(3, 10, r()), U.lerp(1, 3, r()), r() * Math.PI, 0, U.TAU);
      g.fill();
    }

    light = B.canvas(W, H);
    const l = light.getContext('2d');
    for (let i = 0; i < 2600; i++) {
      const x = r() * W, y = r() * H;
      l.fillStyle = `rgba(255,250,235,${U.lerp(0.03, 0.12, r())})`;
      const s = U.lerp(0.6, 1.8, r());
      l.fillRect(x, y, s, s);
    }
    for (let i = 0; i < 500; i++) {
      const x = r() * W, y = r() * H, len = U.lerp(8, 40, r()), a = r() * Math.PI;
      l.strokeStyle = `rgba(255,248,230,${U.lerp(0.04, 0.1, r())})`;
      l.lineWidth = U.lerp(0.4, 1, r());
      l.beginPath();
      l.moveTo(x, y);
      l.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
      l.stroke();
    }
  };

  /**
   * Apply the paper finish to a context already scaled to logical units.
   * strength 0..1 (engine default 1).
   */
  P.apply = (ctx, strength = 1, W = 1920, H = 1080) => {
    if (!grain) P.build(W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.9 * strength;
    ctx.drawImage(grain, 0, 0, W, H);
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.8 * strength;
    ctx.drawImage(light, 0, 0, W, H);
    ctx.restore();
  };

  P.grainCanvas = () => grain;
})(window.TSUKI = window.TSUKI || {});

</script>
<script>
/* ==========================================================================
   text.js — the calligraphy layer (TSUKI.TEXT).
   Poems, titles and narration live in the DOM above the canvas so the
   Japanese can be set vertically (縦書き) in real fonts. Each frame the
   engine calls TEXT.update(T); every style is computed from T alone, so
   seeking and still-frame capture always show the right state.

   Cue shape (see js/script.js):
     { t, dur, kind: 'haiku'|'waka'|'narration'|'title'|'caption'|'cartouche',
       ja: [col, col, ...], author, zh, en, position, x, y, ink: 'light'|'dark',
       size, chirashi: [offsets px], seal }
   ========================================================================== */
(function (TSUKI) {
  'use strict';

  const U = TSUKI.U;
  const TEXT = (TSUKI.TEXT = {});

  let overlay = null, subs = null, subsZh = null, subsEn = null;
  let cues = [];
  let subsEnabled = true;

  const el = (tag, cls, parent) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (parent) parent.appendChild(e);
    return e;
  };

  /** Split a column string into per-character spans; returns span list. */
  const charSpans = (parent, str) => {
    const out = [];
    for (const ch of [...str]) {
      const s = el('span', 'ch', parent);
      s.textContent = ch;
      if (ch === ' ' || ch === '　') s.classList.add('sp');
      out.push(s);
    }
    return out;
  };

  const DEFAULTS = {
    haiku:     { reveal: 2.6, out: 1.6, stagger: 0.11, cls: 'poem haiku' },
    waka:      { reveal: 4.2, out: 1.8, stagger: 0.085, cls: 'poem waka' },
    narration: { reveal: 1.8, out: 1.2, stagger: 0.05, cls: 'poem narration' },
    title:     { reveal: 3.2, out: 2.0, stagger: 0.22, cls: 'title-card' },
    caption:   { reveal: 1.2, out: 1.0, stagger: 0.03, cls: 'caption' },
    cartouche: { reveal: 1.4, out: 1.4, stagger: 0.06, cls: 'cartouche' },
  };

  function build(cue) {
    const d = DEFAULTS[cue.kind] || DEFAULTS.narration;
    const root = el('div', `${d.cls} pos-${cue.position || 'right'} ink-${cue.ink || 'light'}`, overlay);
    root.style.display = 'none';
    if (cue.x != null) { root.style.left = cue.x + 'px'; root.style.right = 'auto'; }
    if (cue.y != null) { root.style.top = cue.y + 'px'; root.style.bottom = 'auto'; }
    if (cue.size) root.style.setProperty('--fs', cue.size + 'px');
    const spans = [];
    if (cue.kind === 'caption') {
      const line = el('div', 'cap-line', root);
      spans.push(...charSpans(line, (cue.ja || []).join(' ')));
    } else {
      const body = el('div', 'cols', root);
      (cue.ja || []).forEach((col, i) => {
        const c = el('div', 'col', body);
        const off = cue.chirashi ? cue.chirashi[i] || 0 : defaultChirashi(cue, i);
        if (off) c.style.marginTop = off + 'px';
        spans.push(...charSpans(c, col));
      });
      if (cue.author || cue.seal) {
        const sig = el('div', 'sig', body);
        if (cue.author) {
          const a = el('div', 'author', sig);
          a.textContent = cue.author;
        }
        if (cue.seal !== false) {
          const s = el('div', 'seal', sig);
          s.textContent = cue.seal || '月';
        }
      }
      if (cue.kind === 'title' && (cue.zh || cue.en)) {
        const sub = el('div', 'title-sub', root);
        if (cue.zh) el('div', 'title-zh', sub).textContent = cue.zh;
        if (cue.en) el('div', 'title-en', sub).textContent = cue.en;
      }
    }
    return { root, spans, d };
  }

  // Default 散らし書き: poems step down column by column like a hand-written
  // tanzaku; narration stays aligned.
  function defaultChirashi(cue, i) {
    if (cue.kind === 'haiku') return [0, 70, 140][i] || 0;
    if (cue.kind === 'waka') return [0, 44, 88, 36, 80][i] || 0;
    return 0;
  }

  /** Initialise with the script. Call once after the DOM exists. */
  TEXT.init = (overlayEl, subsEl, script) => {
    overlay = overlayEl;
    subs = subsEl;
    subs.innerHTML = '';
    subsZh = el('div', 'sub-zh', subs);
    subsEn = el('div', 'sub-en', subs);
    cues = [];
    for (const seg of script.segments) {
      for (const c of seg.text || []) {
        const cue = { ...c, start: seg.start + c.t, end: seg.start + c.t + c.dur, seg: seg.id };
        cue.dom = build(cue);
        cues.push(cue);
      }
    }
    cues.sort((a, b) => a.start - b.start);
  };

  TEXT.setSubs = (on) => {
    subsEnabled = on;
    subs.classList.toggle('off', !on);
  };

  const setIf = (obj, key, val) => {
    if (obj['_' + key] !== val) {
      obj['_' + key] = val;
      return true;
    }
    return false;
  };

  /** Update every cue for global time T. */
  TEXT.update = (T) => {
    let subZh = '', subEn = '', subA = 0;
    for (const cue of cues) {
      const { root, spans, d } = cue.dom;
      const visible = T >= cue.start && T <= cue.end;
      if (setIf(root, 'vis', visible)) root.style.display = visible ? '' : 'none';
      if (!visible) continue;
      const lt = T - cue.start;
      const outP = U.seg(T, cue.end - d.out, cue.end, U.ease.inSine);
      // block-level fade out: dissolve upward like mist
      const blockOp = (1 - outP).toFixed(3);
      if (setIf(root, 'op', blockOp)) {
        root.style.opacity = blockOp;
        root.style.filter = outP > 0.001 ? `blur(${(outP * 5).toFixed(2)}px)` : 'none';
        root.style.translate = outP > 0.001 ? `0 ${(-outP * 14).toFixed(1)}px` : '0 0';
      }
      // per-character ink soak
      const n = spans.length;
      const stagger = Math.min(d.stagger, (d.reveal * 0.75) / Math.max(1, n));
      const charDur = Math.max(0.5, d.reveal - stagger * n);
      for (let i = 0; i < n; i++) {
        const p = U.seg(lt, i * stagger, i * stagger + charDur, U.ease.outCubic);
        const s = spans[i];
        const key = p.toFixed(3);
        if (setIf(s, 'p', key)) {
          s.style.opacity = key;
          s.style.filter = p < 0.999 ? `blur(${((1 - p) * 6).toFixed(2)}px)` : 'none';
          s.style.translate = p < 0.999 ? `0 ${((1 - p) * -8).toFixed(1)}px` : '0 0';
        }
      }
      if (cue.kind !== 'title' && (cue.zh || cue.en)) {
        const a = U.env(lt, 0.8, 2.0, cue.dur - d.out, cue.dur);
        if (a > subA) { subA = a; subZh = cue.zh || ''; subEn = cue.en || ''; }
      }
    }
    if (setIf(subsZh, 'txt', subZh)) subsZh.textContent = subZh;
    if (setIf(subsEn, 'txt', subEn)) subsEn.textContent = subEn;
    const sa = subA.toFixed(3);
    if (setIf(subs, 'op', sa)) subs.style.opacity = sa;
  };

  TEXT.cues = () => cues;
})(window.TSUKI = window.TSUKI || {});

</script>
<script>
/* audio.js — placeholder; replaced by the sound engine. */
(function (TSUKI) { 'use strict'; })(window.TSUKI = window.TSUKI || {});

</script>
<script>
/* ==========================================================================
   engine.js — the projector (TSUKI.ENGINE).
   Owns the stage, the clock, scene registry, transitions between segments,
   the paper finish, the controls and the capture/debug hooks.

   Scenes register with:
     TSUKI.scene('segment-id', {
       init(S)            // optional, once: build caches (S.canvas(), etc.)
       draw(ctx, t, S)    // required: pure function of local time t (s)
     });
   ctx is already scaled so the stage is 1920×1080 logical px.
   S = { W, H, dur, seg, T, U, B, C, canvas(w,h) }.
   A scene may be asked for t slightly < 0 or > dur during transitions:
   keep drawing gracefully (clamp your own timelines).
   ========================================================================== */
(function (TSUKI) {
  'use strict';

  const U = TSUKI.U, B = TSUKI.B;
  const W = 1920, H = 1080;
  const scenes = {};
  TSUKI.scene = (id, def) => { scenes[id] = def; };

  const ENGINE = (TSUKI.ENGINE = { W, H, scenes });

  /* ------------------------------------------------------------------ */
  /* state                                                               */
  /* ------------------------------------------------------------------ */
  let script, segs, total;
  let stage, canvas, ctx, overlay, bufA, bufB, bufM, ctxA, ctxB, ctxM;
  let k = 1;                 // backing px per logical px
  let T = 0;                 // film time (s)
  let playing = false;
  let anchorClock = 0, anchorT = 0, clockKind = 'perf';
  let started = false;
  let muted = false;
  let lastUI = 0;
  const params = new URLSearchParams(location.search);
  const DEBUG = params.has('debug');
  const STILL = params.has('still');
  const errors = {};

  const AUDIO = () => TSUKI.AUDIO;

  /* ------------------------------------------------------------------ */
  /* clock                                                               */
  /* ------------------------------------------------------------------ */
  const audioClock = () => {
    const A = AUDIO();
    return A && A.running && A.running() ? A.now() : null;
  };
  const clockNow = () => {
    const a = audioClock();
    return a != null ? a : performance.now() / 1000;
  };
  const reanchor = () => {
    clockKind = audioClock() != null ? 'audio' : 'perf';
    anchorClock = clockNow();
    anchorT = T;
  };

  /* ------------------------------------------------------------------ */
  /* sizing                                                              */
  /* ------------------------------------------------------------------ */
  function resize() {
    const theatre = document.getElementById('theatre');
    const fs = !!document.fullscreenElement;
    const vw = theatre.clientWidth, vh = theatre.clientHeight;
    const margin = fs || STILL || vw < 700 ? 0 : Math.min(48, vw * 0.03);
    const scale = Math.min((vw - margin * 2) / W, (vh - margin * 2) / H);
    const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
    stage.style.width = cssW + 'px';
    stage.style.height = cssH + 'px';
    overlay.style.transform = `scale(${cssW / W})`;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let bw = Math.round(cssW * dpr);
    if (params.has('w')) bw = parseInt(params.get('w'), 10) || bw;
    bw = U.clamp(bw, 480, 2560);
    const bh = Math.round((bw * H) / W);
    for (const c of [canvas, bufA, bufB, bufM]) { c.width = bw; c.height = bh; }
    k = bw / W;
    for (const c of [ctx, ctxA, ctxB, ctxM]) {
      c.setTransform(k, 0, 0, k, 0, 0);
      c.imageSmoothingQuality = 'high';
    }
    render(T);
  }

  /* ------------------------------------------------------------------ */
  /* scene drawing                                                       */
  /* ------------------------------------------------------------------ */
  function resetCtx(c) {
    c.setTransform(k, 0, 0, k, 0, 0);
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
    c.filter = 'none';
    c.shadowBlur = 0;
    c.shadowColor = 'rgba(0,0,0,0)';
    c.lineCap = 'butt';
    c.lineJoin = 'miter';
  }

  function sceneCtx(seg) {
    return { W, H, dur: seg.duration, seg, T, U, B, C: TSUKI.C, canvas: B.canvas, k };
  }

  function drawSeg(c, seg, t) {
    resetCtx(c);
    c.fillStyle = TSUKI.C.kinari;
    c.fillRect(0, 0, W, H);
    const sc = scenes[seg.id];
    if (!sc) return placeholder(c, seg, t);
    try {
      if (!sc._inited && sc.init) { sc.init(sceneCtx(seg)); }
      sc._inited = true;
      c.save();
      sc.draw(c, t, sceneCtx(seg));
      c.restore();
    } catch (e) {
      if (!errors[seg.id]) { errors[seg.id] = String(e && e.stack || e); console.error(`[scene ${seg.id}]`, e); }
      resetCtx(c);
      placeholder(c, seg, t, true);
    }
    resetCtx(c);
  }

  function placeholder(c, seg, t, broken) {
    c.fillStyle = broken ? '#3a1d1d' : TSUKI.C.koiai;
    c.fillRect(0, 0, W, H);
    B.moon(c, 1380, 360, 150, { halo: 0.6, mica: t });
    c.fillStyle = TSUKI.C.gofun;
    c.font = '48px "Shippori Mincho B1", serif';
    c.textAlign = 'center';
    c.fillText(`${seg.title_ja || seg.id}${broken ? '（描画エラー）' : ''}`, W / 2, H * 0.72);
    c.font = '28px "Shippori Mincho B1", serif';
    c.fillText(`${seg.id} · ${t.toFixed(1)}s / ${seg.duration}s`, W / 2, H * 0.72 + 56);
  }

  /* ------------------------------------------------------------------ */
  /* transitions                                                         */
  /* ------------------------------------------------------------------ */
  let noiseField = null; // low-res fbm for ink dissolves
  function getNoise() {
    if (noiseField) return noiseField;
    const w = 192, h = 108;
    const f = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      f[y * w + x] = 0.75 * U.fbm2(x / 22, y / 22, 4, 41) + 0.25 * U.hash2(x, y);
    }
    const cv = B.canvas(w, h);
    noiseField = { w, h, f, cv, cx: cv.getContext('2d'), img: null };
    noiseField.img = noiseField.cx.createImageData(w, h);
    return noiseField;
  }

  /** Paint a mask into ctxM (white = show B). */
  function maskInk(p, soft = 0.08, center) {
    const N = getNoise();
    const d = N.img.data;
    const th = U.lerp(-soft, 1 + soft, p);
    for (let y = 0; y < N.h; y++) for (let x = 0; x < N.w; x++) {
      const i = y * N.w + x;
      let v = N.f[i];
      if (center) {
        // bias: open first near a point (e.g. the moon)
        const dx = x / N.w - center[0] / W, dy = y / N.h - center[1] / H;
        v = v * 0.55 + Math.min(1, Math.hypot(dx * 1.6, dy) * 1.3) * 0.45;
      }
      const a = U.smoothstep(v - soft, v + soft, th) * 255;
      const o = i * 4;
      d[o] = d[o + 1] = d[o + 2] = 255;
      d[o + 3] = a;
    }
    N.cx.putImageData(N.img, 0, 0);
    ctxM.save();
    ctxM.setTransform(k, 0, 0, k, 0, 0);
    ctxM.clearRect(0, 0, W, H);
    ctxM.imageSmoothingEnabled = true;
    ctxM.drawImage(N.cv, 0, 0, W, H);
    ctxM.restore();
  }

  function composite(type, p, tr) {
    const e = U.ease.inOutSine(p);
    const kin = TSUKI.C.kin, gofun = TSUKI.C.gofun, sumi = TSUKI.C.sumi;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    const full = (c) => ctx.drawImage(c, 0, 0);
    switch (type) {
      case 'cut':
        full(bufB);
        break;
      case 'paper':
      case 'sumi': {
        const col = type === 'paper' ? (tr.color || TSUKI.C.kinari) : (tr.color || sumi);
        if (p < 0.5) { full(bufA); ctx.globalAlpha = U.ease.inOutSine(p * 2); }
        else { full(bufB); ctx.globalAlpha = 1 - U.ease.inOutSine((p - 0.5) * 2); }
        ctx.fillStyle = col;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        break;
      }
      case 'ink': {
        full(bufA);
        maskInk(e, tr.soft || 0.09, tr.center);
        ctxB.save();
        ctxB.setTransform(1, 0, 0, 1, 0, 0);
        ctxB.globalCompositeOperation = 'destination-in';
        ctxB.drawImage(bufM, 0, 0);
        ctxB.restore();
        full(bufB);
        break;
      }
      case 'iris': {
        full(bufA);
        const [cx, cy] = tr.center || [W / 2, H / 2];
        const R = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) * 1.05;
        const r = U.ease.inOutCubic(p) * R;
        const soft = tr.soft == null ? 60 : tr.soft;
        ctxM.save();
        ctxM.setTransform(k, 0, 0, k, 0, 0);
        ctxM.clearRect(0, 0, W, H);
        const g = ctxM.createRadialGradient(cx, cy, Math.max(0, r - soft), cx, cy, r + 0.01);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctxM.fillStyle = g;
        ctxM.fillRect(0, 0, W, H);
        ctxM.restore();
        ctxB.save();
        ctxB.setTransform(1, 0, 0, 1, 0, 0);
        ctxB.globalCompositeOperation = 'destination-in';
        ctxB.drawImage(bufM, 0, 0);
        ctxB.restore();
        full(bufB);
        if (tr.ring !== false && r > 1) {
          ctx.setTransform(k, 0, 0, k, 0, 0);
          ctx.strokeStyle = U.rgba(tr.ringColor || kin, 0.55 * Math.sin(Math.PI * p));
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(cx, cy, r - soft * 0.5, 0, U.TAU);
          ctx.stroke();
        }
        break;
      }
      case 'kasumi': {
        // すやり霞: long mist bands drift in from the right (emaki reading
        // direction), cover the frame, the scene changes beneath them, and
        // they drift on out to the left.
        const rows = tr.rows || 7;
        const col = tr.color || kin;
        const rh = H / rows;
        const pad = 160;
        const s = U.smoothstep(0.42, 0.58, p);
        full(bufA);
        if (s > 0) { ctx.globalAlpha = s; full(bufB); ctx.globalAlpha = 1; }
        ctx.setTransform(k, 0, 0, k, 0, 0);
        for (let i = 0; i < rows; i++) {
          const d = U.hash(i * 7 + 3) * 0.14;
          const q = U.clamp((p - d) / 0.86);
          let L, R;
          if (q < 0.5) { L = U.lerp(W + pad, -pad, U.ease.inOutCubic(q / 0.5)); R = W + pad; }
          else { L = -pad; R = U.lerp(W + pad, -pad, U.ease.inOutCubic((q - 0.5) / 0.5)); }
          const y = i * rh - rh * 0.3 + U.wobble(i * 1.7 + p * 2, 3) * rh * 0.06;
          const shade = U.mix(col, TSUKI.C.gofun, 0.12 * (i % 3));
          B.band(ctx, L, y, R - L, rh * 1.55, shade, tr.alpha == null ? 1 : tr.alpha, 0.35);
        }
        break;
      }
      case 'scroll': {
        // emaki: unrolling right→left means the new scene enters from the
        // LEFT while the old one moves off to the right.
        const x = e * canvas.width;
        ctx.drawImage(bufA, x, 0);
        ctx.drawImage(bufB, x - canvas.width, 0);
        ctx.setTransform(k, 0, 0, k, 0, 0);
        const sx = x / k;
        const g = ctx.createLinearGradient(sx - 40, 0, sx + 40, 0);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.5, `rgba(40,30,20,${0.25 * Math.sin(Math.PI * p)})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(sx - 40, 0, 80, H);
        break;
      }
      case 'cross':
      default:
        full(bufA);
        ctx.globalAlpha = e;
        full(bufB);
    }
    ctx.globalAlpha = 1;
    void gofun;
  }

  /* ------------------------------------------------------------------ */
  /* frame                                                               */
  /* ------------------------------------------------------------------ */
  function segIndexAt(t) {
    for (let i = segs.length - 1; i >= 0; i--) if (t >= segs[i].start) return i;
    return 0;
  }

  function render(t) {
    if (!segs) return;
    t = U.clamp(t, 0, total - 1e-3);
    const i = segIndexAt(t);
    const seg = segs[i];
    const lt = t - seg.start;
    const tr = seg.transition;
    if (i > 0 && tr && tr.type !== 'cut' && lt < tr.dur) {
      const prev = segs[i - 1];
      drawSeg(ctxA, prev, t - prev.start);
      drawSeg(ctxB, seg, lt);
      resetCtx(ctx);
      composite(tr.type, U.clamp(lt / tr.dur), tr);
    } else {
      drawSeg(ctx, seg, lt);
    }
    resetCtx(ctx);
    if (!params.has('nopaper')) TSUKI.PAPER.apply(ctx, script.paperStrength == null ? 1 : script.paperStrength);
    TSUKI.TEXT.update(t);
    updateUI(t, i);
    if (DEBUG) debugHUD(t, seg, lt);
  }

  function debugHUD(t, seg, lt) {
    resetCtx(ctx);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(12, 12, 560, 40);
    ctx.fillStyle = '#fff';
    ctx.font = '22px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`T ${t.toFixed(2)}  ${seg.id}  t ${lt.toFixed(2)}/${seg.duration}`, 22, 40);
  }

  function frame() {
    requestAnimationFrame(frame);
    if (playing) {
      if ((clockKind === 'audio') !== (audioClock() != null)) reanchor();
      T = anchorT + (clockNow() - anchorClock);
      if (T >= total) { T = total - 1e-3; pause(); showEnd(true); }
      const A = AUDIO();
      if (A && A.update) A.update(T);
      render(T);
    }
  }

  /* ------------------------------------------------------------------ */
  /* transport                                                           */
  /* ------------------------------------------------------------------ */
  function play() {
    if (T >= total - 0.05) seek(0);
    playing = true;
    showEnd(false);
    const A = AUDIO();
    if (A && A.play) A.play(T);
    reanchor();
    document.body.classList.add('playing');
    document.body.classList.remove('paused');
    pokeUI();
  }
  function pause() {
    playing = false;
    const A = AUDIO();
    if (A && A.pause) A.pause();
    document.body.classList.remove('playing');
    document.body.classList.add('paused');
    pokeUI();
  }
  function seek(t) {
    T = U.clamp(t, 0, total - 1e-3);
    const A = AUDIO();
    if (A && A.seek) A.seek(T, playing);
    reanchor();
    showEnd(false);
    render(T);
  }
  const toggle = () => (playing ? pause() : play());

  /* ------------------------------------------------------------------ */
  /* UI                                                                  */
  /* ------------------------------------------------------------------ */
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  let uiSegIdx = -1, uiTime = '';

  function buildUI() {
    const ticks = $('ticks');
    ticks.innerHTML = '';
    segs.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'tick';
      b.type = 'button';
      b.style.left = (s.start / total) * 100 + '%';
      b.style.width = (s.duration / total) * 100 + '%';
      b.title = `${s.title_ja}${s.title_zh ? ' · ' + s.title_zh : ''}`;
      b.setAttribute('aria-label', `第${i + 1}段 ${s.title_ja}`);
      b.addEventListener('click', (ev) => { ev.stopPropagation(); seek(s.start + 0.01); pokeUI(); });
      ticks.appendChild(b);
    });
    const scrub = $('scrub');
    scrub.max = String(total);
    scrub.addEventListener('input', () => { seek(parseFloat(scrub.value)); pokeUI(); });
    $('btn-play').addEventListener('click', (e) => { e.stopPropagation(); ensureStarted(); toggle(); });
    $('btn-subs').addEventListener('click', (e) => { e.stopPropagation(); setSubs(!subsOn); });
    $('btn-sound').addEventListener('click', (e) => { e.stopPropagation(); setMuted(!muted); });
    $('btn-full').addEventListener('click', (e) => { e.stopPropagation(); fullscreen(); });
    $('btn-start').addEventListener('click', (e) => { e.stopPropagation(); start(); });
    $('btn-again').addEventListener('click', (e) => { e.stopPropagation(); seek(0); play(); });
    stage.addEventListener('click', () => { if (started) toggle(); });
    for (const ev of ['mousemove', 'touchstart']) document.addEventListener(ev, pokeUI, { passive: true });
    document.addEventListener('keydown', onKey);
    document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });
    document.addEventListener('fullscreenchange', resize);
    window.addEventListener('resize', resize);
  }

  let subsOn = true;
  function setSubs(on) {
    subsOn = on;
    TSUKI.TEXT.setSubs(on);
    $('btn-subs').setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('tsuki.subs', on ? '1' : '0'); } catch (e) { /* storage unavailable */ }
  }
  function setMuted(m) {
    muted = m;
    const A = AUDIO();
    if (A && A.setMuted) A.setMuted(m);
    $('btn-sound').setAttribute('aria-pressed', String(!m));
    $('btn-sound').classList.toggle('muted', m);
  }
  function fullscreen() {
    const el = $('theatre');
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }
  function ensureStarted() {
    if (started) return;
    started = true;
    document.body.classList.add('started');
    const A = AUDIO();
    if (A && A.init && !params.has('nosound')) {
      try { A.init(); A.setMuted && A.setMuted(muted); } catch (e) { console.warn('audio init failed', e); }
    }
  }
  function start() {
    ensureStarted();
    play();
  }
  function showEnd(on) {
    document.body.classList.toggle('ended', on);
  }
  function pokeUI() {
    lastUI = performance.now();
    document.body.classList.add('ui');
    clearTimeout(pokeUI._t);
    pokeUI._t = setTimeout(() => {
      if (playing && performance.now() - lastUI > 2400) document.body.classList.remove('ui');
    }, 2600);
  }
  function updateUI(t, i) {
    const ts = `${fmt(t)} / ${fmt(total)}`;
    if (ts !== uiTime) { uiTime = ts; $('time').textContent = ts; $('scrub').value = String(t); }
    if (i !== uiSegIdx) {
      uiSegIdx = i;
      const s = segs[i];
      $('seg-name').textContent = `${s.title_ja}${s.title_zh ? '　' + s.title_zh : ''}`;
      document.querySelectorAll('.tick').forEach((el, j) => el.classList.toggle('on', j === i));
    }
  }
  function onKey(e) {
    if (e.target && (e.target.tagName === 'INPUT' && e.target.type !== 'range')) return;
    const i = segIndexAt(T);
    switch (e.key) {
      case ' ': case 'k': case 'K':
        e.preventDefault();
        if (!started) start(); else toggle();
        break;
      case 'ArrowRight': e.preventDefault(); seek(i < segs.length - 1 ? segs[i + 1].start + 0.01 : T); break;
      case 'ArrowLeft': e.preventDefault(); seek(T - segs[i].start > 2 ? segs[i].start + 0.01 : segs[Math.max(0, i - 1)].start + 0.01); break;
      case 'l': case 'L': seek(T + 5); break;
      case 'j': case 'J': seek(T - 5); break;
      case 'f': case 'F': fullscreen(); break;
      case 'c': case 'C': setSubs(!subsOn); break;
      case 'm': case 'M': setMuted(!muted); break;
      default: return;
    }
    pokeUI();
  }

  /* ------------------------------------------------------------------ */
  /* boot                                                                */
  /* ------------------------------------------------------------------ */
  function normaliseScript(s) {
    let t = 0;
    s.segments.forEach((seg, i) => {
      seg.index = i;
      seg.start = t;
      t += seg.duration;
    });
    return t;
  }

  ENGINE.boot = () => {
    script = TSUKI.SCRIPT;
    segs = script.segments;
    total = normaliseScript(script);
    stage = $('stage');
    canvas = $('film');
    overlay = $('overlay');
    ctx = canvas.getContext('2d', { alpha: false });
    bufA = B.canvas(1, 1); bufB = B.canvas(1, 1); bufM = B.canvas(1, 1);
    ctxA = bufA.getContext('2d'); ctxB = bufB.getContext('2d'); ctxM = bufM.getContext('2d');
    TSUKI.PAPER.build(W, H);
    TSUKI.TEXT.init(overlay, $('subs'), script);
    buildUI();
    try { setSubs(localStorage.getItem('tsuki.subs') !== '0'); } catch (e) { setSubs(true); }
    setMuted(params.has('nosound'));
    let t0 = 0;
    if (params.has('t')) t0 = parseFloat(params.get('t')) || 0;
    if (params.has('seg')) {
      const s = segs.find((x) => x.id === params.get('seg'));
      if (s) t0 = s.start + (parseFloat(params.get('st')) || 0);
    }
    if (!params.has('t') && !params.has('seg') && script.posterT != null) t0 = script.posterT;
    T = U.clamp(t0, 0, total - 1e-3);
    resize();
    if (STILL) document.body.classList.add('still');
    document.body.classList.add('paused');
    requestAnimationFrame(frame);
    const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    ENGINE.ready = fontsReady.then(() => { render(T); return true; });
    // capture / automation hooks
    window.__film = {
      ready: ENGINE.ready,
      get total() { return total; },
      get time() { return T; },
      segments: segs.map((s) => ({ id: s.id, start: s.start, duration: s.duration, title_ja: s.title_ja })),
      seek: (t) => { seek(t); return T; },
      render: (t) => { T = U.clamp(t, 0, total - 1e-3); render(T); return T; },
      play, pause,
      errors: () => ({ ...errors }),
      start: () => { started = true; document.body.classList.add('started'); },
    };
    if (params.has('autoplay')) { started = true; document.body.classList.add('started'); play(); }
  };

  ENGINE.seek = (t) => seek(t);
  ENGINE.time = () => T;
  ENGINE.total = () => total;
  ENGINE.isPlaying = () => playing;
})(window.TSUKI = window.TSUKI || {});

</script>
