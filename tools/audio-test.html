<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>audio test</title>
</head>
<body>
<!-- tools/audio-test.html — loaded by tools/audio-test.js (headless). -->
<script src="../js/core/util.js"></script>
<script src="../js/core/audio.js"></script>
<script src="audio-demo-score.js"></script>
<script>
'use strict';
/* analysis helpers used by tools/audio-test.js */
window.T = (() => {
  const db = (x) => (x > 0 ? 20 * Math.log10(x) : -999);

  function fftMag(re) {                         // radix-2, in place copy
    const n = re.length, im = new Float64Array(n), r = Float64Array.from(re);
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { const t = r[i]; r[i] = r[j]; r[j] = t; }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = (-2 * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const a = i + k, b = a + len / 2;
          const xr = r[b] * cr - im[b] * ci, xi = r[b] * ci + im[b] * cr;
          r[b] = r[a] - xr; im[b] = im[a] - xi; r[a] += xr; im[a] += xi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
    const m = new Float64Array(n / 2);
    for (let i = 0; i < n / 2; i++) m[i] = Math.hypot(r[i], im[i]);
    return m;
  }

  /** Levels, safety and a crude per-second spectral centroid. onsets: s. */
  function analyze(buf, onsets = []) {
    const sr = buf.sampleRate, n = buf.length, chs = [buf.getChannelData(0), buf.getChannelData(1)];
    const mask = new Uint8Array(n);
    for (const t of onsets) {
      const a = Math.max(0, Math.floor((t - 0.006) * sr)), b = Math.min(n, Math.ceil((t + 0.05) * sr));
      for (let i = a; i < b; i++) mask[i] = 1;
    }
    let peak = 0, sum = 0, nan = 0, clip = 0, jumps = 0, jumpsAll = 0, maxJump = 0, maxJumpAt = 0;
    const dc = [0, 0];
    chs.forEach((d, c) => {
      for (let i = 0; i < n; i++) {
        const x = d[i];
        if (!Number.isFinite(x)) { nan++; continue; }
        const ax = Math.abs(x);
        if (ax > peak) peak = ax;
        if (ax >= 0.999) clip++;
        sum += x * x;
        dc[c] += x;
        if (i) {
          const j = Math.abs(x - d[i - 1]);
          if (j > maxJump) { maxJump = j; maxJumpAt = i / sr; }
          if (j > 0.2) { jumpsAll++; if (!mask[i]) jumps++; }
        }
      }
    });
    // clicks, finer: 2nd difference far above its local level, outside onsets
    let spikes = 0;
    const spikeAt = [];
    {
      const d = chs[0], w = Math.round(sr * 0.01);
      let acc = 0;
      const dd = new Float32Array(n);
      for (let i = 1; i < n - 1; i++) dd[i] = Math.abs(d[i + 1] - 2 * d[i] + d[i - 1]);
      for (let i = 0; i < Math.min(n, w); i++) acc += dd[i];
      for (let i = w; i < n - w; i++) {
        acc += dd[i + w - 1] - dd[i - w];
        const local = acc / (2 * w);
        if (!mask[i] && dd[i] > 0.02 && dd[i] > local * 14) { spikes++; if (spikeAt.length < 8) spikeAt.push(+(i / sr).toFixed(3)); i += w; }
      }
    }
    const perSec = [];
    const N = 2048;
    for (let s = 0; s * sr < n; s++) {
      const a = s * sr, b = Math.min(n, a + sr);
      let ss = 0;
      for (let i = a; i < b; i++) ss += (chs[0][i] ** 2 + chs[1][i] ** 2) / 2;
      const rms = Math.sqrt(ss / Math.max(1, b - a));
      const spec = new Float64Array(N / 2);
      let frames = 0;
      for (let f = a; f + N <= b; f += N) {
        const fr = new Float64Array(N);
        for (let i = 0; i < N; i++) fr[i] = ((chs[0][f + i] + chs[1][f + i]) / 2) * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / N));
        const m = fftMag(fr);
        for (let i = 0; i < N / 2; i++) spec[i] += m[i];
        frames++;
      }
      let num = 0, den = 0;
      for (let i = 1; i < N / 2; i++) { num += spec[i] * ((i * sr) / N); den += spec[i]; }
      perSec.push({ s, rmsDb: +db(rms).toFixed(1), centroid: den > 0 ? Math.round(num / den) : 0 });
    }
    const loud = perSec.reduce((m, x) => Math.max(m, x.rmsDb), -999);
    return {
      seconds: +(n / sr).toFixed(2), peakDb: +db(peak).toFixed(2), rmsDb: +db(Math.sqrt(sum / (2 * n))).toFixed(1),
      loudestSecDb: loud, nan, clip, dc: dc.map((x) => +(x / n).toExponential(2)),
      jumps, jumpsAll, maxJump: +maxJump.toFixed(3), maxJumpAt: +maxJumpAt.toFixed(3), spikes, spikeAt, perSec,
    };
  }

  function wavB64(buf) {
    const n = buf.length, sr = buf.sampleRate, L = buf.getChannelData(0), R = buf.getChannelData(1);
    const bytes = new Uint8Array(44 + n * 4), v = new DataView(bytes.buffer);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) bytes[o + i] = s.charCodeAt(i); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, n * 4, true);
    for (let i = 0, o = 44; i < n; i++, o += 4) {
      v.setInt16(o, Math.max(-32768, Math.min(32767, Math.round(L[i] * 32767))), true);
      v.setInt16(o + 2, Math.max(-32768, Math.min(32767, Math.round(R[i] * 32767))), true);
    }
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  return { analyze, wavB64, sleep, db };
})();
</script>
</body>
</html>
