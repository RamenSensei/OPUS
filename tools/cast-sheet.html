<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Cast model sheet</title>
<style>
  html, body { margin: 0; background: #222; }
  canvas { display: block; width: 100vw; height: 56.25vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../js/core/util.js"></script>
<script src="../js/core/palette.js"></script>
<script src="../js/core/brush.js"></script>
<script src="../js/core/cast.js"></script>
<script>
/* ==========================================================================
   Cast model sheets.  ?sheet=1..6  ?t=seconds  ?focus=name&scale=s  ?perf=1
   1 · every character × pose on washi (mid scale)
   2 · night & moon: back views, silhouettes, rise, tennyo, moon rabbits
   3 · small-scale legibility (40–90 px figures) + a crowd
   4 · Kaguya large
   5 · the others large
   6 · motion strips (t series)
   ========================================================================== */
(function () {
  'use strict';
  const { U, B, C, CAST } = window.TSUKI;
  const q = new URLSearchParams(location.search);
  const W = 1920, H = 1080;
  const cv = document.getElementById('c');
  const k = (parseInt(q.get('w'), 10) || 1920) / W;
  cv.width = Math.round(W * k); cv.height = Math.round(H * k);
  const ctx = cv.getContext('2d');
  ctx.setTransform(k, 0, 0, k, 0, 0);
  const T = parseFloat(q.get('t') || '0');

  const label = (x, y, s, col, size) => {
    ctx.save();
    ctx.font = `${size || 13}px ui-monospace, monospace`;
    ctx.fillStyle = col || 'rgba(28,26,24,0.55)';
    ctx.textAlign = 'center';
    ctx.fillText(s, x, y);
    ctx.restore();
  };
  const washi = () => {
    ctx.fillStyle = C.kinari;
    ctx.fillRect(0, 0, W, H);
    const r = U.rng(3);
    ctx.fillStyle = U.rgba(C.torinoko, 0.35);
    for (let i = 0; i < 900; i++) ctx.fillRect(r() * W, r() * H, 1 + r() * 18, 0.8);
  };
  const night = () => {
    B.sky(ctx, [[0, C.tetsukon], [0.55, C.koiai], [1, C.kon]]);
  };
  const title = (s, dark) => label(W / 2, 30, s, dark ? 'rgba(238,242,234,0.6)' : 'rgba(28,26,24,0.6)', 16);

  /* flow layout: items {name, pose, scale, opts, lab} */
  function flow(items, x0, y0, x1, gap, dark) {
    let x = x0, y = y0, rowH = 0;
    const rows = [];
    let row = [];
    for (const it of items) {
      const bb = CAST.bounds(it.name, it.pose, it.opts);
      const w = bb[2] * it.scale, h = bb[3] * it.scale;
      if (x + w > x1 && row.length) {
        rows.push({ row, rowH });
        x = x0; y += rowH + gap; rowH = 0; row = [];
      }
      row.push({ it, bb, x, y, w, h });
      x += Math.max(w, 60) + gap;
      rowH = Math.max(rowH, h);
    }
    if (row.length) rows.push({ row, rowH });
    let yy = y0;
    for (const R of rows) {
      for (const c of R.row) {
        const { it, bb } = c;
        const ax = c.x - (it.opts && it.opts.facing < 0 ? -(bb[0] + bb[2]) : bb[0]) * it.scale;
        const ay = yy + R.rowH - (bb[1] + bb[3]) * it.scale;
        const o = Object.assign({ pose: it.pose, t: T }, it.opts || {});
        CAST[it.name](ctx, ax, ay, it.scale, o);
        label(c.x + c.w / 2, yy + R.rowH + 16, it.lab || `${it.name}.${it.pose}`, dark ? 'rgba(238,242,234,0.5)' : undefined, 12);
      }
      yy += R.rowH + gap;
    }
    return yy;
  }
  const allPoses = (scale, extra) => {
    const out = [];
    for (const name of Object.keys(CAST.POSES)) {
      for (const pose of CAST.POSES[name]) out.push({ name, pose, scale, opts: Object.assign({}, extra) });
    }
    return out;
  };

  const sheets = {
    1() {
      washi(); title('sheet 1 · every character × pose · scale 0.5');
      flow(allPoses(0.5), 40, 60, 1880, 30);
    },
    2() {
      night();
      B.moon(ctx, 1300, 420, 330, { halo: 0.7, maria: 0 });
      title('sheet 2 · night · back views, ascent & silhouettes', true);
      // moon rabbits printed on the disc
      const mr = U.mix(C.kin, C.kitsune, 0.35);
      CAST.rabbit(ctx, 1440, 330, 2.1, { pose: 'pound', silhouette: mr, alpha: 0.55, t: T, phase: (T * 0.6) % 1 });
      CAST.rabbit(ctx, 1560, 350, 1.6, { pose: 'gaze', silhouette: mr, alpha: 0.45, t: T, facing: -1 });
      // the hero: back view gazing up
      CAST.kaguya(ctx, 1100, 1010, 1.85, { pose: 'back', t: T, wind: 0.3 });
      // ascent
      CAST.kaguya(ctx, 330, 360, 0.95, { pose: 'rise', t: T, wind: 0.6 });
      CAST.kaguya(ctx, 640, 330, 0.8, { pose: 'rise', robe: 'hagoromo', look: 'up', t: T, wind: 0.6 });
      // celestial envoy: a flyer and a small procession on clouds
      CAST.tennyo(ctx, 760, 150, 0.55, { pose: 'fly', instrument: 'flute', t: T, facing: -1 });
      ['sho', 'lute', 'none'].forEach((ins, i) => CAST.tennyo(ctx, 150 + i * 110, 610 - i * 20, 0.34, { pose: 'stand', instrument: ins, t: T + i }));
      // silhouettes against the night (sumi)
      const sil = U.mix(C.tetsukon, C.sumi, 0.5);
      CAST.okina(ctx, 110, 1030, 0.55, { pose: 'reach', silhouette: sil, t: T });
      CAST.ouna(ctx, 190, 1030, 0.55, { pose: 'weep', silhouette: sil, t: T });
      CAST.mikado(ctx, 430, 1030, 0.5, { pose: 'gaze', silhouette: sil, t: T });
      CAST.guard(ctx, 520, 1030, 0.4, { pose: 'aim', silhouette: sil, t: T });
      CAST.guard(ctx, 580, 1030, 0.4, { pose: 'aim', silhouette: sil, t: T });
      CAST.child(ctx, 650, 1030, 0.55, { pose: 'reach', silhouette: sil, t: T });
      CAST.elder(ctx, 720, 1030, 0.55, { pose: 'point', silhouette: sil, t: T });
      CAST.deer(ctx, 840, 1030, 0.45, { pose: 'call', silhouette: sil, t: T });
      CAST.kaguya(ctx, 330, 1030, 0.42, { pose: 'back', silhouette: sil, t: T });
      // alpha fades (buffered, no overlap seams)
      CAST.kaguya(ctx, 330, 860, 0.5, { pose: 'stand', t: T, alpha: 0.45 });
      CAST.okina(ctx, 470, 860, 0.5, { pose: 'kneel', t: T, alpha: 0.6 });
    },
    3() {
      washi(); title('sheet 3 · small scales (0.14 · 0.22 · 0.3)');
      let y = flow(allPoses(0.14), 40, 60, 1880, 16);
      y = flow(allPoses(0.22), 40, y + 10, 1880, 18);
      flow(allPoses(0.3), 40, y + 10, 1880, 20);
    },
    4() {
      washi(); title('sheet 4 · Kaguya large');
      flow(CAST.POSES.kaguya.map((p) => ({ name: 'kaguya', pose: p, scale: 1.25 })), 40, 70, 1880, 40);
    },
    5() {
      washi(); title('sheet 5 · others large');
      const items = [];
      for (const n of Object.keys(CAST.POSES)) if (n !== 'kaguya') for (const p of CAST.POSES[n]) items.push({ name: n, pose: p, scale: n === 'rabbit' || n === 'fox' || n === 'deer' ? 1.3 : 0.95 });
      flow(items, 40, 60, 1880, 30);
    },
    6() {
      washi(); title('sheet 6 · motion strips t = 0 … 5.25 (0.75 s)');
      const rows = [
        ['kaguya', 'back', 0.62, { wind: 0.8 }],
        ['kaguya', 'stand', 0.62, { wind: 0.8 }],
      ];
      if (CAST.POSES.kaguya.indexOf('rise') >= 0) rows.push(['kaguya', 'rise', 0.55, { wind: 0.5 }]);
      if (CAST.POSES.tennyo) rows.push(['tennyo', 'fly', 0.5, { instrument: 'flute' }]);
      if (CAST.POSES.rabbit) rows.push(['rabbit', 'pound', 0.9, {}]);
      let y = 60;
      for (const [n, p, s, extra] of rows) {
        const bb = CAST.bounds(n, p, extra);
        const h = bb[3] * s;
        for (let i = 0; i < 8; i++) {
          const t = i * 0.75;
          const cx = 130 + i * 230;
          const o = Object.assign({ pose: p, t, phase: (t * 0.6) % 1 }, extra);
          CAST[n](ctx, cx - (bb[0] + bb[2] / 2) * s, y - bb[1] * s, s, o);
          label(cx, y + h + 14, `${n}.${p} t=${t}`, undefined, 11);
        }
        y += h + 34;
        if (y > 1000) break;
      }
    },
    7() {
      washi(); title('sheet 7 · variants: facing, palette overrides, options');
      const OMINAESHI = { kasane: [U.mix(C.yamabuki, C.koke, 0.35), U.mix(C.yamabuki, C.wakatake, 0.3), C.susuki, U.mix(C.susuki, C.gofun, 0.5), C.gofun, C.aotake], karaginu: C.aotake, karaginuFg: C.matsuba };
      const KURENAI = { kasane: [C.enji, C.akane, C.beni, C.toki, U.mix(C.toki, C.gofun, 0.5), C.gofun], karaginu: C.murasaki, karaginuFg: U.mix(C.murasaki, C.fuji, 0.4), hakama: C.enji };
      flow([
        { name: 'kaguya', pose: 'stand', scale: 0.62, opts: { facing: -1, palette: OMINAESHI }, lab: 'stand facing:-1 女郎花' },
        { name: 'kaguya', pose: 'weep', scale: 0.62, opts: { stand: true }, lab: 'weep stand:true' },
        { name: 'kaguya', pose: 'seated', scale: 0.62, opts: { palette: KURENAI, train: 0.6 }, lab: 'seated 紅の匂 train:.6' },
        { name: 'kaguya', pose: 'back', scale: 0.62, opts: { look: 0 }, lab: 'back look:0' },
        { name: 'kaguya', pose: 'back', scale: 0.62, opts: { look: 1, train: 0.3, palette: KURENAI }, lab: 'back look:1 train:.3' },
        { name: 'kaguya', pose: 'stand', scale: 0.62, opts: { outline: 0 }, lab: 'outline:0 (flat)' },
        { name: 'kaguya', pose: 'rise', scale: 0.5, opts: { robe: 'hagoromo', look: 'up', lean: -0.05 }, lab: 'rise hagoromo look:up' },
        { name: 'kaguya', pose: 'baby', scale: 0.8, opts: { glow: 0.3 }, lab: 'baby glow:.3' },
        { name: 'okina', pose: 'kneel', scale: 0.62, opts: { holding: 'none', facing: -1 }, lab: 'okina kneel holding:none' },
        { name: 'child', pose: 'reach', scale: 0.8, opts: { girl: true }, lab: 'child girl:true' },
        { name: 'child', pose: 'stand', scale: 0.8, opts: { girl: true, palette: { kimono: C.toki, kimonoFg: C.beni, obi: C.kikyo } }, lab: 'child girl palette' },
        { name: 'guard', pose: 'aim', scale: 0.62, opts: { facing: -1, palette: { robe: C.akane, robeFg: C.enji, lining: C.kin } }, lab: 'guard 緋袍 facing:-1' },
        { name: 'fox', pose: 'sit', scale: 1.6, opts: { color: 'gold' }, lab: 'fox color:gold' },
        { name: 'fox', pose: 'walk', scale: 1.6, opts: { color: 'gold', facing: -1 }, lab: 'fox gold walk' },
        { name: 'deer', pose: 'stand', scale: 0.62, opts: { antlers: false }, lab: 'deer antlers:false' },
        { name: 'tennyo', pose: 'fly', scale: 0.55, opts: { instrument: 'lute', dir: -0.3 }, lab: 'tennyo lute dir:-.3' },
        { name: 'tennyo', pose: 'fly', scale: 0.55, opts: { instrument: 'sho', facing: -1 }, lab: 'tennyo sho facing:-1' },
        { name: 'tennyo', pose: 'stand', scale: 0.55, opts: { instrument: 'flute' }, lab: 'tennyo stand flute' },
        { name: 'rabbit', pose: 'pound', scale: 1.8, opts: { silhouette: C.sumi }, lab: 'rabbit silhouette' },
        { name: 'mikado', pose: 'gaze', scale: 0.55, opts: { train: 0.4, facing: -1 }, lab: 'mikado gaze train:.4' },
      ], 30, 60, 1890, 26);
    },
    8() {
      washi(); title('sheet 8 · close-ups (faces at hero scale)');
      // [name, pose, scale, x of the head (local), distance of the head below the bounds top]
      const cells = [
        ['kaguya', 'stand', 5, 7, 32], ['kaguya', 'back', 5, 4, 38], ['kaguya', 'weep', 4.2, 24, 34], ['kaguya', 'rise', 4.2, 0, 45],
        ['okina', 'stand', 4.5, 42, 64], ['ouna', 'stand', 4.5, 30, 66], ['mikado', 'stand', 4, 8, 82], ['child', 'reach', 4.5, 0, 50],
        ['tennyo', 'stand', 4.5, 6, 42], ['guard', 'stand', 4.5, 2, 90], ['rabbit', 'sit', 9, 45, 40], ['fox', 'sit', 7, 45, 45],
      ];
      const cw = W / 4, chh = (H - 50) / 3;
      cells.forEach(([n, p, sc, cx, cy], i) => {
        const x0 = (i % 4) * cw, y0 = 50 + Math.floor(i / 4) * chh;
        ctx.save();
        ctx.beginPath(); ctx.rect(x0 + 4, y0 + 4, cw - 8, chh - 8); ctx.clip();
        const u = n === 'rabbit' || n === 'fox' ? 0.55 : 1;
        const bb = CAST.bounds(n, p);
        const hy = bb[1] + cy * u; // head height (local, logical px at scale 1)
        CAST[n](ctx, x0 + cw / 2 - cx * u * sc, y0 + chh / 2 - hy * sc, sc, { pose: p, t: T });
        ctx.restore();
        label(x0 + cw / 2, y0 + chh - 10, `${n}.${p} ×${sc}`, undefined, 11);
      });
    },
    9() {
      // 影絵 catalogue on moon-white paper: every puppet in a few states (multiply, 藍鼠)
      ctx.fillStyle = C.geppaku; ctx.fillRect(0, 0, W, H);
      title('sheet 9 · 影絵 puppets · CAST.drawPuppet (multiply 藍鼠) · sticks · negative puppets');
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      const P = (n, x, y, s, o) => { CAST.drawPuppet(ctx, n, x, y, s, Object.assign({ t: T, penumbra: 1 }, o)); };
      // row 1: kaguya grow morph (negative puppet)
      [0, 0.25, 0.5, 0.75, 1].forEach((g, i) => { P('kaguya', 110 + i * 150 + g * 40, 330, 1, { grow: g, facing: -1, sticks: false }); label(110 + i * 150 + g * 40, 360, `kaguya grow:${g}`); });
      P('kaguya-engawa', 1010, 330, 1, { raise: 0, facing: -1, sticks: false }); label(1010, 360, 'kaguya-engawa raise:0');
      P('kaguya-engawa', 1270, 330, 1, { raise: 1, facing: -1, sticks: false }); label(1270, 360, 'raise:1');
      P('moon', 1560, 200, 0.9, { stickAngle: 0.5 }); label(1560, 360, 'moon (stick)');
      P('bamboo', 1800, 360, 0.52, { shine: 1 }); label(1800, 378, 'bamboo shine:1');
      // row 2: okina walk cycle + cut swing, bamboo split
      [0, 0.25, 0.5, 0.75].forEach((ph, i) => { P('okina', 90 + i * 110, 600, 1.4, { phase: ph, facing: -1, sticks: false }); label(90 + i * 110, 625, `okina ph:${ph}`); });
      [0, 0.5, 1].forEach((sw, i) => { P('okina', 560 + i * 130, 600, 1.4, { pose: 'cut', swing: sw, sticks: false }); label(560 + i * 130, 625, `cut swing:${sw}`); });
      [0.3, 1].forEach((sp, i) => { P('bamboo', 1000 + i * 120, 620, 0.5, { split: sp, sticks: false }); label(1000 + i * 120, 640, `split:${sp}`); });
      P('palanquin', 1500, 620, 1.2, { facing: -1 }); label(1500, 640, 'palanquin (鳳輦) facing:-1');
      // row 3: cloud of celestials, たけ's shadow (CAST.grandma silhouette, buffered), cut mode on a dark field
      P('cloud', 420, 900, 1.2, { penumbra: 6, alpha: 0.7, facing: -1 }); label(420, 1010, 'cloud penumbra:6 alpha:.7');
      CAST.grandma(ctx, 1000, 1000, 1.5, { pose: 'lift-haori', lift: 1, silhouette: CAST.AINEZU, buffer: true, t: T }); label(1000, 1030, 'grandma lift-haori (silhouette 藍鼠, buffer)');
      ctx.restore();
      ctx.fillStyle = C.sumi; ctx.fillRect(1300, 700, 560, 330);
      CAST.drawPuppet(ctx, 'kaguya', 1430, 990, 1.2, { mode: 'cut', grow: 1, facing: -1, sticks: false });
      CAST.drawPuppet(ctx, 'moon', 1700, 830, 0.8, { mode: 'cut', stickAngle: -0.3 });
      label(1580, 1050, "mode:'cut' (destination-out) on sumi");
    },
    focus() {
      const name = q.get('focus');
      const sc = parseFloat(q.get('scale') || '1');
      const dark = q.has('dark');
      dark ? night() : washi();
      title(`focus · ${name} · scale ${sc} · t=${T}`, dark);
      const poses = CAST.POSES[name] || [];
      let y = flow(poses.map((p) => ({ name, pose: p, scale: sc })), 40, 60, 1880, 40, dark);
      y = flow(poses.map((p) => ({ name, pose: p, scale: sc * 0.4 })), 40, y + 10, 1880, 30, dark);
      flow(poses.map((p) => ({ name, pose: p, scale: 0.15 })), 40, y + 10, 1880, 24, dark);
    },
    zoom() {
      // ?zoom=name&pose=p&scale=s&cx=&cy= : local point (cx,cy) at canvas centre, several poses side by side
      const name = q.get('zoom');
      const sc = parseFloat(q.get('scale') || '4');
      const cx = parseFloat(q.get('cx') || '0'), cy = parseFloat(q.get('cy') || '-150');
      const poses = (q.get('pose') || CAST.POSES[name][0]).split(',');
      q.has('dark') ? night() : washi();
      const cw = W / poses.length;
      poses.forEach((p0, i) => {
        // "pose~key:value~key:value" adds options, e.g. rise~robe:hagoromo
        const [p, ...kv] = p0.split('~');
        const extra = {};
        // values: numbers, palette names (C.*), 'ainezu' (藍鼠, the shoji-shadow ink), or strings
        const col = (v) => (v === 'ainezu' ? U.mix(C.ai, C.nezumi, 0.5) : C[v] || v);
        for (const s of kv) { const [k, v] = s.split(':'); extra[k] = isNaN(+v) ? ((k === 'silhouette' || k === 'ink') && v !== 'true' ? col(v) : v === 'true' ? true : v === 'false' ? false : v) : +v; }
        ctx.save();
        ctx.beginPath(); ctx.rect(i * cw, 0, cw, H); ctx.clip();
        CAST[name](ctx, i * cw + cw / 2 - cx * sc, H / 2 - cy * sc, sc, Object.assign({ pose: p, t: T }, extra));
        ctx.restore();
        label(i * cw + cw / 2, H - 20, `${name}.${p0} ×${sc}`);
      });
    },
    pzoom() {
      // ?pzoom=name&v=k:v~k:v,k:v&scale=&cy= : puppet variants side by side on moon-white
      const name = q.get('pzoom');
      const sc = parseFloat(q.get('scale') || '2');
      const cy = parseFloat(q.get('cy') || '-100');
      const vs = (q.get('v') || '').split(',');
      ctx.fillStyle = C.geppaku; ctx.fillRect(0, 0, W, H);
      const cw = W / vs.length;
      vs.forEach((v0, i) => {
        const o = { t: T, penumbra: 1, sticks: false };
        for (const s of v0.split('~').filter(Boolean)) { const [k, v] = s.split(':'); o[k] = isNaN(+v) ? (v === 'true' ? true : v === 'false' ? false : v) : +v; }
        ctx.save();
        ctx.beginPath(); ctx.rect(i * cw, 0, cw, H); ctx.clip();
        ctx.globalCompositeOperation = 'multiply';
        CAST.drawPuppet(ctx, name, i * cw + cw / 2, H / 2 - cy * sc, sc, o);
        ctx.restore();
        label(i * cw + cw / 2, H - 20, `${name} ${v0} ×${sc}`);
      });
    },
    perf() {
      washi(); title('perf · ms per draw at scale 1 (100 draws, flushed)');
      const off = document.createElement('canvas');
      off.width = 1920; off.height = 1080;
      const o2 = off.getContext('2d', { willReadFrequently: true });
      const lines = [];
      let worst = 0;
      for (const name of Object.keys(CAST.POSES)) {
        for (const pose of CAST.POSES[name]) {
          for (const variant of [{}, { alpha: 0.6 }]) {
            // warm up, then 100 draws in 5 flushed batches of 20: mean over all 100 and the median batch
            for (let i = 0; i < 5; i++) CAST[name](o2, 960, 700, 1, Object.assign({ pose, t: i * 0.1 }, variant));
            o2.getImageData(0, 0, 1, 1);
            const batches = [];
            for (let b = 0; b < 5; b++) {
              const t0 = performance.now();
              for (let i = 0; i < 20; i++) CAST[name](o2, 960, 700, 1, Object.assign({ pose, t: (b * 20 + i) * 0.05, phase: ((b * 20 + i) * 0.03) % 1 }, variant));
              o2.getImageData(0, 0, 1, 1);
              batches.push((performance.now() - t0) / 20);
            }
            const mean = batches.reduce((a, v) => a + v, 0) / 5;
            const ms = batches.slice().sort((a, b) => a - b)[2];
            if (!variant.alpha) worst = Math.max(worst, ms);
            lines.push(`${(name + '.' + pose).padEnd(22)} ${variant.alpha ? 'alpha 0.6' : 'opaque   '}  median ${ms.toFixed(3)} ms  mean ${mean.toFixed(3)} ms`);
          }
        }
      }
      lines.push(`worst opaque (median batch): ${worst.toFixed(3)} ms`);
      console.log(lines.join('\n'));
      ctx.font = '14px ui-monospace, monospace';
      ctx.fillStyle = C.sumi;
      lines.forEach((l, i) => ctx.fillText(l, 60 + Math.floor(i / 60) * 600, 70 + (i % 60) * 16));
      window.__info = `worst opaque ${worst.toFixed(3)} ms`;
    },
  };

  const which = q.has('perf') ? 'perf' : q.has('pzoom') ? 'pzoom' : q.has('zoom') ? 'zoom' : q.has('focus') ? 'focus' : (q.get('sheet') || '1');
  const fn = sheets[which] || sheets[1];
  const t0 = performance.now();
  try { fn(); } catch (e) { console.error(e && e.stack || e); }
  if (!window.__info) window.__info = `drawn in ${(performance.now() - t0).toFixed(1)} ms`;
  window.__done = true;
})();
</script>
</body>
</html>
